# Optional, for users of the pre-commit tool (https://pre-commit.com): `pre-commit install -t pre-commit -t pre-push`.
# Without it, `git config core.hooksPath .githooks` enables the same checks.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (API keys, tokens, private keys, local patterns)
        entry: python scripts/secret_scan.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Same check as .githooks/pre-push. pre-commit passes the pushed commit as PRE_COMMIT_TO_REF (not on stdin),
      # which --push reads; it hands over only the first branch of a push with several branches.
      - id: secret-scan-push
        name: secret scan of the commits being pushed
        entry: python scripts/secret_scan.py --push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
