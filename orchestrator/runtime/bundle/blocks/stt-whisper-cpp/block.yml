schema: llmcf-bundle-block/1
id: stt-whisper-cpp
version: 1.0.0
kind: stt
title: Speech recognition (whisper.cpp server)
status: ready
summary: >-
  whisper.cpp's whisper-server for the board's architecture with one ggml whisper model, on 127.0.0.1.
variables:
  - {name: port, type: port, default: 8090, help: "Loopback port of the server"}
  - {name: threads, type: threads, default: 0, help: "CPU threads (0: whisper.cpp decides)"}
  - {name: language, type: choice, default: auto, choices: [auto, en, de, fr, es, it, nl, pl, pt, ru, zh, ja]}
  - {name: memory_limit_mb, type: memory_mb, default: 1024, help: "Memory limit of its unit (autostart only)"}
  - {name: user, type: user, default: llmcf, help: "Account its unit runs as (autostart only)"}
  - {name: autostart, type: bool, default: false, help: "Start at boot through its own unit (needs llmcf-install)"}
files:
  - {role: program, from: person, name: whisper-server, mode: "0755", formats: [elf],
     note: "whisper.cpp's examples/server, built for the board's architecture"}
  - {role: model, from: person, name: model.bin, formats: [ggml-whisper], licence: required, min_bytes: 1048576}
memory: {base_mb: 128, model_factor: 1.5}
unit: true
start:
  program: whisper-server
  args:
    - --host
    - 127.0.0.1
    - --port
    - "{port}"
    - -m
    - "@FILE:model@"
    - -l
    - "{language}"
    - {when: threads, args: [-t, "{threads}"]}
