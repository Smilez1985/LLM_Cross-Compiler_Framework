schema: llmcf-bundle-block/1
id: gateway-llmcf
version: 1.0.0
kind: gateway
title: Gateway (llmcf-gateway)
status: ready
summary: >-
  llmcf-gateway, the framework's token-saving OpenAI-compatible front in front of the bundle's llama-server: strict
  JSON checks, the context budget from the board's start parameters, prompt-cache reuse, size caps, a rate limit,
  health and metrics; loopback by default, the local network only with TLS.
variables:
  - {name: port, type: port, default: 8088, help: "Port of the gateway"}
  - {name: bind, type: choice, choices: [loopback, lan], default: loopback, help: "loopback, or lan (TLS only)"}
  - {name: max_body_kb, type: uint, default: 256, min: 4, max: 16384, help: "Largest request body in KB"}
  - {name: max_tokens, type: uint, default: 512, min: 16, max: 1048576, help: "Cap on the tokens of one answer"}
  - {name: rate_per_minute, type: uint, default: 60, min: 1, max: 100000, help: "Requests per minute per client"}
  - {name: max_inflight, type: uint, default: 2, min: 1, max: 64, help: "Requests the model works on at once"}
  - {name: queue_max, type: uint, default: 32, min: 0, max: 1024, help: "Requests that may wait for a place"}
  - {name: queue_wait_seconds, type: uint, default: 120, min: 1, max: 3600, help: "Longest wait for a place"}
  - {name: memory_floor_mb, type: uint, default: 64, min: 0, max: 1048576, help: "Free memory below which requests wait (0: off; set by the bundle from the board's measurement)"}
  - {name: memory_psi_max, type: uint, default: 50, min: 0, max: 100, help: "Memory pressure in percent above which requests wait (0: off)"}
  - {name: idle_stop_minutes, type: uint, default: 0, min: 0, max: 10080, help: "Stop an engine after these minutes without a request (0: never; needs the engines' units)"}
  - {name: upstream_port, type: port, default: 8080, help: "Set by the bundle: the llm component's port"}
  - {name: ctx_size, type: uint, default: 4096, min: 256, max: 262144, help: "Set by the bundle: the llm's context"}
  - {name: stt_port, type: uint, default: 0, min: 0, max: 65535, help: "Set by the bundle: whisper-server's port (0: none)"}
  - {name: vision_port, type: uint, default: 0, min: 0, max: 65535, help: "Set by the bundle: the vision server's port (0: none)"}
  - {name: vision_ctx_size, type: uint, default: 4096, min: 256, max: 262144, help: "Set by the bundle: the vision server's context"}
  - {name: max_audio_mb, type: uint, default: 25, min: 1, max: 200, help: "Largest audio upload in MB"}
  - {name: max_images, type: uint, default: 4, min: 0, max: 16, help: "Images one chat request may carry (0: none)"}
  - {name: max_image_kb, type: uint, default: 2048, min: 16, max: 16384, help: "Largest image in KB"}
  - {name: max_images_kb, type: uint, default: 4096, min: 16, max: 65536, help: "All images of one request in KB"}
  - {name: image_tokens, type: uint, default: 768, min: 16, max: 16384, help: "Tokens one image is counted with"}
  - {name: memory_limit_mb, type: memory_mb, default: 64, help: "Memory limit of its unit (autostart only)"}
  - {name: user, type: user, default: llmcf, help: "Account its unit runs as (autostart only)"}
  - {name: autostart, type: bool, default: false, help: "Start at boot through its own unit (needs llmcf-install)"}
files:
  - {role: program, from: framework, name: llmcf-gateway, mode: "0755", formats: [elf]}
memory: {base_mb: 64}
unit: true
start:
  program: llmcf-gateway
  args:
    - serve
    - --port
    - "{port}"
    - --bind
    - "{bind}"
    - --upstream-port
    - "{upstream_port}"
    - --ctx-size
    - "{ctx_size}"
    - --max-body-kb
    - "{max_body_kb}"
    - --max-tokens
    - "{max_tokens}"
    - --rate-per-minute
    - "{rate_per_minute}"
    - --max-inflight
    - "{max_inflight}"
    - --queue-max
    - "{queue_max}"
    - --queue-wait-seconds
    - "{queue_wait_seconds}"
    - --memory-floor-mb
    - "{memory_floor_mb}"
    - --memory-psi-max
    - "{memory_psi_max}"
    - {when: stt_port, args: [--stt-port, "{stt_port}", --max-audio-mb, "{max_audio_mb}"]}
    - when: vision_port
      args: [--vision-port, "{vision_port}", --vision-ctx-size, "{vision_ctx_size}", --max-images, "{max_images}",
             --max-image-kb, "{max_image_kb}", --max-images-kb, "{max_images_kb}", --image-tokens, "{image_tokens}"]
    - --idle-stop-minutes
    - "{idle_stop_minutes}"
