  # --- ARM CPU features --------------------------------------------------------------------------------------
  # Linux: ON if every token of cpuinfo is in the Features line (any one of cpuinfo_any for NEON), else OFF;
  # UNKNOWN when /proc/cpuinfo has no Features line. Windows on ARM: IsProcessorFeaturePresent(windows_feature) with
  # windows_min_build as for x86; no constant -> UNKNOWN. macOS: sysctl hw.optional.arm.<macos_sysctl> = 1 -> ON.
  # Non-ARM ARCH: OFF.
  SUPPORTS_NEON:
    group: arm
    type: bool
    cpuinfo_any: [asimd, neon]
    windows_feature: 29
    windows_min_build: 0
    macos_sysctl: hw.optional.neon
    only_arch: [arm64, armv7, armv6]
    stability: stable
    perf: key
    platforms: [linux, windows, macos]
    sources:
      linux: "Features asimd (arm64) or neon (32-bit ARM)"
      windows: "PF_ARM_V8_INSTRUCTIONS_AVAILABLE (29): every ARMv8 core has Advanced SIMD"
      macos: "hw.optional.neon"
