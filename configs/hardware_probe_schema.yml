# Per-GPU keys: GPU<n>_<NAME> for n = 0 .. GPU_COUNT-1 (no leading zeros). The bool keys are required for every GPU.
gpu_keys:
  VENDOR:
    group: gpu
    type: enum
    values: [nvidia, amd, intel, apple, arm, qualcomm, imagination, broadcom, other]
    required: true
    stability: stable
    perf: key
    platforms: [linux, windows, macos]
    sources:
      linux: "PCI vendor id via tables.pci_vendors; device tree arm,mali-* -> arm (Mali detection unverified)"
      windows: "VEN_ part of the adapter's PnP id via tables.pci_vendors"
      macos: "constant apple on Apple Silicon; Intel Macs: the PCI vendor"
    normalise: "table lookup; not in the table -> other"
    consumers: [recipe, ditto, preflight, gui]
  NAME:
    group: gpu
    type: text
    max_length: 128
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      linux: "nvidia-smi name, else the Vulkan deviceName, else the PCI id"
      windows: "Name of Win32_VideoController"
      macos: "chipset model of system_profiler"
    normalise: "whitespace trimmed and collapsed"
    consumers: [gui, proposal]
  PCI_ID:
    group: gpu
    type: pattern
    pattern: '^0x[0-9a-f]{4}:0x[0-9a-f]{4}$'
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: "/sys/bus/pci/devices/<address>/vendor and device"
      windows: "VEN_ and DEV_ parts of the adapter's PnP id"
    normalise: "<vendor>:<device>, lower-case hex with 0x"
    consumers: [recipe, ditto, match]
  DISCRETE:
    group: gpu
    type: bool
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      linux: >-
        NVIDIA: ON on PCI, OFF for an integrated Tegra GPU without a PCI address (Jetson); AMD: OFF for the APU device
        ids of hardware.py, else ON; Intel: OFF unless an Arc device id
      windows: "as Linux, from the PnP device id"
      macos: "OFF on Apple Silicon"
    normalise: "ON/OFF/UNKNOWN"
    consumers: [ditto, recipe]
  UNIFIED:
    group: gpu
    type: bool
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      any: >-
        ON when the GPU shares the system RAM (Apple Silicon, integrated AMD and Intel GPUs, Mali, NVIDIA Tegra on
        Jetson)
    normalise: "ON/OFF/UNKNOWN"
    consumers: [ditto]
  VRAM_MB:
    group: gpu
    type: int
    min: 0
    max: 16777216
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      linux: "nvidia-smi memory.total; amdgpu mem_info_vram_total"
      windows: "nvidia-smi; HardwareInformation.qwMemorySize of the display-class registry key"
    normalise: "MiB, rounded down"
    consumers: [ditto, recipe, preflight]
  VRAM_FREE_MB:
    group: gpu
    type: int
    min: 0
    max: 16777216
    required: false
    stability: volatile
    perf: none
    platforms: [linux, windows]
    sources:
      linux: "nvidia-smi memory.free; amdgpu mem_info_vram_total - mem_info_vram_used"
      windows: "nvidia-smi memory.free"
    normalise: "MiB, rounded down"
    consumers: [ditto]
  DRIVER_VERSION:
    group: gpu
    type: version
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources: {linux: "nvidia-smi driver_version", windows: "nvidia-smi; DriverVersion of Win32_VideoController"}
    normalise: "dotted number"
    consumers: [recipe, preflight]
  COMPUTE_CAP:
    group: gpu
    type: pattern
    pattern: '^\d{1,2}\.\d$'
    only_gpu_vendor: [nvidia]
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources: {any: "nvidia-smi --query-gpu=compute_cap"}
    normalise: "major.minor (8.6)"
    consumers: [recipe, preflight]
  GFX_TARGET:
    group: gpu
    type: pattern
    pattern: '^gfx[0-9a-f]{3,5}$'
    only_gpu_vendor: [amd]
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: "gfx_target_version of the KFD topology node (/sys/class/kfd/kfd/topology/nodes/*/properties)"
      windows: "WMI (limited; left out when not readable)"
    normalise: "gfx + hex digits (gfx1103)"
    consumers: [recipe]
  SOURCE:
    group: gpu
    type: enum
    values: [nvidia-smi, sysfs, kfd, vulkaninfo, wmi, registry, system-profiler, device-tree]
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources: {any: "the probe that found the GPU first"}
    normalise: none
    consumers: [gui]

# Schema 1 (today's .sh v2.4 and .ps1 v2.5 output, no PROBE_SCHEMA line) is still read. The parser maps:
#   PLATFORM -> OS; ARCH / CPU_ARCH_TYPE -> ARCH; OS_VERSION (.ps1) -> OS_VERSION_ID; CPU_VENDOR_ID -> CPU_VENDOR;
#   CPU_FLAGS_ALL (space separated) -> comma list, and every x86/ARM SUPPORTS_* key derived from it with the cpuinfo
#   tokens above (SUPPORTS_F16C from the f16c token). The file's own SUPPORTS_AVX2 / _AVX512 / _FP16 / _NEON lines
#   are never taken over: without a flag list the CPU features are UNKNOWN (OFF outside their ARCH), because the
#   .sh then wrote OFF for everything. RAM_SWAP_MB -> SWAP_TOTAL_MB; GPU_VENDOR / GPU_VENDOR_ID / GPU_DEVICE_ID /
#   GPU_MODEL / GPU_VRAM_MB / GPU_DRIVER_VERSION -> GPU0_*; NPU_VENDOR / NPU_MODEL -> lower case; NPU_DEVICE_ID
#   SoC_RKxxxx -> SOC_MODEL; DEVICE_NODE -> NPU_DEVICE; NPU_MODE / USB ids -> USB_ROCKCHIP_*; DOCKER_VERSION ->
#   TOOL_DOCKER; PYTHON_VERSION -> TOOL_PYTHON.
# Every CPU feature of a .ps1 file becomes UNKNOWN (its IsProcessorFeaturePresent constants are wrong), and its
# RAM_TOTAL_MB (the sum of the SMBIOS slots) is dropped. HOSTNAME, RAM_SLOT_*, CPU_DEVICE_ID and every other key are
# dropped without keeping the value. A key written twice with different values is dropped as ambiguous. Values that
# fail validation are dropped. Booleans the file lacks become UNKNOWN. The result carries PROBE_CONVERTED_FROM=1 and
# the warnings converted_from_schema_1 and reprobe_before_build: run the probe again before a build.
