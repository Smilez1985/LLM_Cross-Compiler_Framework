    normalise: "first dotted number of the first line"
    consumers: [recipe]
  TOOL_NINJA:
    group: toolchain
    type: version
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources: {any: "ninja --version"}
    normalise: "first dotted number"
