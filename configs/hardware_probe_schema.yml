  # --- memory and disk ---------------------------------------------------------------------------------------
  RAM_TOTAL_MB:
    group: memory
    type: int
    min: 16
    max: 16777216
    required: true
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "MemTotal of /proc/meminfo (kB)"
      windows: "ullTotalPhys of GlobalMemoryStatusEx (never the sum of the SMBIOS memory slots)"
      macos: "sysctl hw.memsize"
    normalise: "usable memory in MiB, rounded down"
    consumers: [ditto, recipe, preflight, bench, gui]
  SWAP_TOTAL_MB:
    group: memory
    type: int
    min: 0
    max: 16777216
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      linux: "SwapTotal of /proc/meminfo (kB)"
      windows: "ullTotalPageFile - ullTotalPhys of GlobalMemoryStatusEx"
      macos: "sysctl vm.swapusage total"
    normalise: "MiB, rounded down"
    consumers: [recipe, preflight]
  RAM_AVAILABLE_MB:
    group: memory
    type: int
    min: 0
    max: 16777216
    required: false
    stability: volatile
    perf: none
    platforms: [linux, windows, macos]
    sources:
      linux: "MemAvailable of /proc/meminfo (kB)"
      windows: "ullAvailPhys of GlobalMemoryStatusEx"
      macos: "free + inactive pages of vm_stat times the page size"
    normalise: "MiB, rounded down"
    consumers: [ditto, recipe]
  DISK_FREE_MB:
    group: memory
    type: int
    min: 0
    max: 2147483647
    required: false
    stability: volatile
    perf: none
    platforms: [linux, windows, macos]
    sources:
      any: >-
        free space of the file system holding the framework state folder (PCs) or the user's home folder (the
        install folder on devices); Python shutil.disk_usage, shell df -Pk
    normalise: "MiB, rounded down"
    consumers: [recipe, deploy, preflight]
  RAM_TYPE:
    group: memory
    type: enum
    values: [DDR3, DDR4, DDR5, LPDDR3, LPDDR4, LPDDR4X, LPDDR5, LPDDR5X]
    required: false
    stability: stable
    perf: recorded
    platforms: [windows]
    sources:
      linux: "not read (dmidecode needs root, and the probes never ask for it): left out"
      windows: "SMBIOSMemoryType of the first Win32_PhysicalMemory entry via tables.smbios_memory_types"
    normalise: "table lookup; not in the table -> left out"
    consumers: [bench, gui]
  RAM_SPEED_MTS:
    group: memory
    type: int
    min: 100
    max: 20000
    required: false
    stability: stable
    perf: recorded
    platforms: [windows]
    sources:
      linux: "not read (dmidecode needs root): left out"
      windows: "highest ConfiguredClockSpeed (else Speed) of Win32_PhysicalMemory"
    normalise: "MT/s, decimal integer"
    consumers: [bench, gui]

  # --- SoC -----------------------------------------------------------------------------------------------------
  SOC_VENDOR:
    group: soc
    type: pattern
    pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux, android]
    sources:
      linux: "vendor part of the last entry of /proc/device-tree/compatible (rockchip,rk3566 -> rockchip)"
    normalise: "lower case"
    consumers: [match, gui]
  SOC_MODEL:
    group: soc
    type: pattern
    pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    known: soc_models_known
    required: false
    stability: stable
    perf: key
    platforms: [linux, android]
    sources:
      linux: "model part of the last entry of /proc/device-tree/compatible (rockchip,rk3566 -> rk3566)"
    normalise: "lower case; values outside tables.soc_models_known are display only"
    consumers: [match, recipe, preflight, deploy, gui]
  BOARD_MODEL:
    group: soc
    type: text
    max_length: 128
    required: false
    stability: stable
    perf: none
    platforms: [linux, android]
    sources:
      linux: "/proc/device-tree/model (product name of the board; never a serial number)"
    normalise: "trailing NUL removed, whitespace trimmed and collapsed"
    consumers: [gui, proposal]

  JETSON_L4T_VERSION:
    group: soc
    type: pattern
    pattern: '^\d{2}\.\d{1,2}\.\d{1,2}$'
    only_os: [linux]
    only_arch: [arm64]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        the first line of /etc/nv_tegra_release (NVIDIA Jetson Linux: "# R35 (release), REVISION: 4.1, GCID: ...,
        BOARD: ..., EABI: aarch64, DATE: ..."; NVIDIA's Jetson Linux guide points to this file for the installed
        release); read only when the file exists
    normalise: >-
      <R number>.<REVISION>: R35 with REVISION 4.1 -> 35.4.1 (the BSP version NVIDIA names r35.4.1 for JetPack 5.1.2);
      a file without that line: left out with not_determined:JETSON_L4T_VERSION
    consumers: [preflight, deploy, generator, gui]
  JETSON_JETPACK_VERSION:
    group: soc
    type: pattern
    pattern: '^\d{1,2}\.\d{1,2}(\.\d{1,2})?$'
    only_os: [linux]
    only_arch: [arm64]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        /var/lib/dpkg/status: the Version of the package nvidia-jetpack when its Status is "install ok installed"
        (what apt-cache show nvidia-jetpack reports; "5.1.2-b104" is JetPack 5.1.2); left out without the package
        (a Jetson flashed with the BSP only), no warning
    normalise: "the leading dotted number of the package version (6.1+b123 -> 6.1)"
    consumers: [preflight, deploy, generator, gui]
  # --- NPU and USB-attached boards ---------------------------------------------------------------------------
  NPU_VENDOR:
    group: npu
    type: enum
    values: [rockchip, hailo, axelera, memryx, google, intel, qualcomm, apple, amd, other]
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows]
    sources:
      linux: >-
        the SoC NPU first (device node of NPU_DEVICE), then PCI/USB vendor ids in the order of the SUPPORTS_* NPU
        keys below
      windows: "PnP vendor ids in the same order"
    normalise: "lower case vendor name; one NPU is described (the SUPPORTS_* keys tell about the others)"
    consumers: [preflight, match, generator, gui]
  NPU_MODEL:
    group: npu
    type: pattern
    pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: >-
        Rockchip NPU: SOC_MODEL; Hailo: HAILO_ARCH with a "-" after "hailo" (hailo8l -> hailo-8l, hailo10h ->
        hailo-10h), left out without HAILO_ARCH; Intel NPU (intel_vpu driver): intel-npu; others (Axelera, MemryX,
        Coral): left out
      windows: "Hailo: as on Linux; Intel: intel-npu; others: left out"
    normalise: "lower case identifier (rk3566, rk3588, hailo-8, hailo-8l, hailo-10h, intel-npu)"
    consumers: [preflight, bench, gui]
  NPU_DEVICE:
    group: npu
    type: pattern
    # Only accelerator nodes: a deploy step may pass this value to `docker run --device`, so an untrusted profile
    # must never name a disk, memory or other device node. A new kind of NPU node is added here on purpose.
    pattern: '^/dev/(rknpu|dri/(renderD|card)[0-9]{1,3}|accel/accel[0-9]{1,3}|hailo[0-9]{1,3}|h1x(-[0-9]{1,3})?|apex_[0-9]{1,3})$'
    required: false
    stability: stable
    perf: none
    platforms: [linux]
    sources:
      linux: >-
        the node that was found: /dev/rknpu, a DRM node of the vendor rknpu driver (/dev/dri/renderD<N> or
        /dev/dri/card<N> whose device driver is "RKNPU", compared without case), /dev/accel/accel<N> (mainline
        rocket or intel_vpu driver), a Hailo node (/dev/<entry> of the first entry of the sysfs classes hailo_chardev,
        hailo1x and hailo1x_integrated: /dev/hailo<N>, /dev/h1x-<N> or /dev/h1x; else /dev/hailo<N>), /dev/apex_<N>
    normalise: "absolute path of one of the accelerator nodes in the pattern"
    consumers: [deploy, preflight]
  RKNPU_DRIVER_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    only_os: [linux, android]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        the first readable version node of the vendor rknpu driver: /sys/module/rknpu/version, /proc/rknpu/version
        (world-readable when the kernel has the driver's procfs option; "RKNPU driver: v0.9.6"),
        /sys/kernel/debug/rknpu/version (root only); none readable: left out with needs_root:RKNPU_DRIVER_VERSION
    normalise: "digits and dots only; compared and displayed, never placed on a command line"
    consumers: [preflight, deploy]
  RKLLM_RUNTIME_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    only_os: [linux, android]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: "version string inside an installed librkllmrt.so (unverified)"
    normalise: "digits and dots only; compared and displayed, never placed on a command line"
    consumers: [preflight, deploy]
  RKNN_RUNTIME_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    only_os: [linux, android]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: "version string inside an installed librknnrt.so (unverified)"
    normalise: "digits and dots only; compared and displayed, never placed on a command line"
    consumers: [preflight, deploy]
  USB_ROCKCHIP_PID:
    group: npu
    type: pattern
    pattern: '^0x[0-9a-f]{4}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows]
    sources:
      linux: "lsusb -d 2207: (first device)"
      windows: "PID_ part of a PnP device with VID_2207"
    normalise: "lower-case hex with 0x"
    consumers: [deploy, gui]
  USB_ROCKCHIP_MODE:
    group: npu
    type: enum
    values: [rockusb, adb, adb-mtp, other]
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows]
    sources:
      any: "USB_ROCKCHIP_PID via tables.usb_rockchip_pids; not in the table -> other"
    normalise: "table lookup"
    consumers: [deploy, gui]
  SUPPORTS_RKNN:
    group: npu
    type: bool
    only_os: [linux, android]
    stability: stable
    perf: key
    platforms: [linux]
    sources:
      linux: >-
        ON when this machine's Rockchip SoC NPU node exists (NPU_DEVICE); a board attached over USB does not
        count
      windows: "OFF"
    normalise: "ON/OFF"
    consumers: [preflight, generator, match]
  SUPPORTS_HAILO:
    group: npu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: >-
        PCI vendor 0x1e60 (/sys/bus/pci/devices/*/vendor), a USB device of tables.hailo_usb_devices, an entry of a
        sysfs class of tables.hailo_sysfs_classes, a /dev/hailo<N> node, or a device hailortcli scan lists
      windows: "PnP VEN_1E60, a USB device of tables.hailo_usb_devices, or a device hailortcli scan lists"
    normalise: "ON/OFF"
    consumers: [preflight, generator, match]
  SUPPORTS_METIS:
    group: npu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources: {linux: "PCI vendor 0x1f4b (Axelera)", windows: "PnP VEN_1F4B"}
    normalise: "ON/OFF"
    consumers: [preflight, generator]
  SUPPORTS_MX3:
    group: npu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: "PCI/USB vendor of the MemryX MX3 (today's scripts use 0x1d6b, a generic id: unverified)"
      windows: "PnP device as on Linux"
    normalise: "ON/OFF"
    consumers: [preflight, generator]
  SUPPORTS_CORAL:
    group: npu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: "Google Coral Edge TPU: USB 1a6e:089a or 18d1:9302, PCI 1ac1:089a, or /dev/apex_<N>"
      windows: "PnP device with the same ids"
    normalise: "ON/OFF"
    consumers: [preflight, generator]
  SUPPORTS_INTEL_NPU:
    group: npu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: "/dev/accel/accel<N> bound to the intel_vpu driver"
      windows: "PnP device \"Intel(R) AI Boost\""
    normalise: "ON/OFF"
    consumers: [preflight]

  INTEL_NPU_DEVICE:
    group: npu
    type: pattern
    # An accelerator node only (a deploy step may pass it to `docker run --device`), as NPU_DEVICE.
    pattern: '^/dev/accel/accel[0-9]{1,3}$'
    only_os: [linux]
    required: false
    stability: stable
    perf: none
    platforms: [linux]
    sources:
      linux: >-
        the first /sys/class/accel/accel<N> whose device driver is intel_vpu (the Intel NPU of Core Ultra
        processors), also when NPU_DEVICE describes another NPU
    normalise: "/dev/accel/accel<N>"
    consumers: [deploy, preflight, recipe]
  # --- Hailo accelerators (HAILO_PLAN.md section 2; written whatever NPU NPU_VENDOR describes) ------------------
  # Linux, files first (no tool): /sys/module/<driver> (never lsmod), the sysfs classes, /dev nodes, PCI and USB ids.
  # Then hailortcli with fixed arguments, an empty stdin and the time limit, never with sudo, at most 60 s in all:
  # -v, scan, and fw-control identify -s <id> for up to 16 devices (never --extended, which prints the MAC address and
  # the SoC and ULT ids; of identify only the "Device Architecture" and "Firmware Version" lines are read, NUL bytes
  # removed, and a run counts only when the architecture line was there). Device ids stay in memory, never in a file.
  HAILO_FAMILY:
    group: npu
    type: enum
    values: [hailo8, hailo1x]
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: >-
        all of: HAILO_ARCH via tables.hailo_arch_family, the kernel module via tables.hailo_drivers, each sysfs class
        entry via tables.hailo_sysfs_classes (and a hailo_chardev entry's device_id via tables.hailo_pci_devices),
        the PCI ids via tables.hailo_pci_devices, the USB ids via tables.hailo_usb_devices
      windows: "HAILO_ARCH and the PnP PCI and USB ids through the same tables"
    normalise: >-
      the one family these name: hailo8 = HailoRT 4.x (branch hailo8), hailo1x = HailoRT 5.x (branch master). Only
      from a device or its driver (never from an installed HailoRT alone). Sources that disagree (HAILO8L with module
      hailo1x_pci, two kinds of devices): HAILO_FAMILY and HAILO_ARCH left out with not_determined:HAILO_FAMILY
    consumers: [preflight, match, generator, gui, deploy, recipe]
  HAILO_ARCH:
    group: npu
    type: enum
    values: [hailo8, hailo8l, hailo10h, hailo15h, hailo15m, hailo15l, hailo12l]
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      any: >-
        hailortcli fw-control identify -s <id> for each device of hailortcli scan: the word after "Device
        Architecture:" via tables.hailo_arch_names (the exact word, never a substring); without one, a USB device of
        tables.hailo_usb_devices when no Hailo PCI device is there
    normalise: >-
      the spelling of the Dataflow Compiler's --hw-arch. HAILO15H on a PCIe or USB device -> hailo10h (what hailo-apps
      and Application-Code-Examples do; unverified on a board), on the integrated device -> hailo15h. An unknown word
      or devices of different architectures: left out with not_determined:HAILO_ARCH; a device without an
      architecture: not_determined:HAILO_ARCH, or needs_root:HAILO_ARCH when hailortcli answered and the node cannot be
      opened for reading and writing; nothing when version_mismatch or not_determined:HAILO_FAMILY explains it
    consumers: [preflight, match, generator, gui, deploy, recipe]
  HAILO_DEVICES:
    group: npu
    type: int
    min: 0
    max: 64
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows]
    sources:
      any: >-
        the devices hailortcli scan lists ("[-] Device: <id>"; "Hailo devices not found" = 0); when it lists none or
        did not run and a device was seen: the sysfs class entries, else the /dev/hailo<N> nodes, else the PCI and
        USB devices of the tables
    normalise: >-
      decimal integer; written when SUPPORTS_HAILO=ON or hailortcli scan answered; hailortcli installed without an
      answer and no device seen: not_determined:HAILO_DEVICES
    consumers: [preflight, gui, deploy]
  HAILO_INTERFACE:
    group: npu
    type: enum
    values: [pcie, usb, integrated]
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows]
    sources:
      any: >-
        the form of the ids hailortcli scan lists: pci/<address> or a bare PCI address -> pcie, usb/<bus>:<addr> ->
        usb, [integrated] -> integrated; without them PCI vendor 0x1e60 -> pcie, a USB id of tables.hailo_usb_devices
        -> usb, an entry of the sysfs class hailo1x_integrated -> integrated (Ethernet devices are never looked for)
    normalise: "written only when every device has the same interface, else left out with not_determined:HAILO_INTERFACE"
    consumers: [preflight, gui, deploy]
  HAILO_DRIVER:
    group: npu
    type: enum
    values: [hailo_pci, hailo1x_pci, hailo_integrated_nnc]
    only_os: [linux]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: "the first of tables.hailo_drivers with a folder /sys/module/<name> (a built-in driver has one too)"
    normalise: "the module name"
    consumers: [preflight, deploy]
  HAILO_DRIVER_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    only_os: [linux]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: "/sys/module/<HAILO_DRIVER>/version (every Hailo driver sets MODULE_VERSION(HAILO_DRV_VER))"
    normalise: >-
      the first dotted number; the module there without a readable version: left out with
      not_determined:HAILO_DRIVER_VERSION. Driver, firmware and HailoRT must be the same release: the preflight and
      deploy compare them, the probe only reports them
    consumers: [preflight, deploy]
  HAILO_FW_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      any: "the \"Firmware Version:\" line of hailortcli fw-control identify (4.24.0 of \"4.24.0 (release,app,...)\")"
    normalise: >-
      the dotted number; devices with different firmware: left out with not_determined:HAILO_FW_VERSION; a device and
      its driver without hailortcli: left out with not_determined:HAILO_FW_VERSION
    consumers: [preflight, deploy]
  HAILORT_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      any: >-
        "HailoRT-CLI version X.Y.Z" of hailortcli -v, which is also the libhailort version: the CLI checks the two
        before it parses any argument and refuses to run when they differ, printing "libhailort version (x) does not
        match HailoRT-CLI version (y)" on stderr
    normalise: >-
      X.Y.Z; that message, or a non-zero exit without the version line: left out with version_mismatch:HAILORT_VERSION
      (scan and identify are then not run); an answer without the line: not_determined:HAILORT_VERSION
    consumers: [preflight, deploy, recipe]
  HAILO_PYHAILORT_VERSION:
    group: npu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      linux: >-
        the pip distribution hailort (imported as hailo_platform), never imported: importlib.metadata in the probe's
        own interpreter (hardware_probe.py, not in a sysroot), then the first "Version:" line of METADATA in
        /usr/lib/python3/dist-packages/hailort-*.dist-info and /usr/local/lib/python3*/dist-packages/hailort-*.dist-info
        (that the Debian package python3-hailort installs it there is unverified); virtual environments are the
        person's and never searched
      windows: "importlib.metadata in hardware_probe.py; the .ps1 leaves it out"
    normalise: "the dotted number"
    consumers: [preflight, deploy]

  # --- GPU (global keys; per-GPU keys in gpu_keys) -------------------------------------------------------------
  GPU_COUNT:
    group: gpu
    type: int
    min: 0
    max: 16
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      linux: >-
        nvidia-smi; vulkaninfo --summary; /sys/class/drm display-class PCI devices with the amdgpu sysfs and the KFD
        topology; device tree (Mali). vulkaninfo's GPUs are matched with sysfs by PCI id (AMD GPUs without one in
        order when the counts agree); without vulkaninfo the sysfs and device-tree GPUs are listed
      windows: >-
        nvidia-smi; vulkaninfo --summary; display adapters of WMI Win32_VideoController and the display-class
        registry
      macos: "system_profiler SPDisplaysDataType"
    normalise: >-
      number of GPU<n> entries: the NVIDIA GPUs of nvidia-smi first (its order is the PCI bus order), then the other
      GPUs in the order of their source; at most 16
    consumers: [recipe, ditto, preflight, gui]
  NVIDIA_DRIVER_CUDA_MAX:
    group: gpu
    type: pattern
    pattern: '^\d{1,2}\.\d{1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources: {any: "\"CUDA Version: X.Y\" in the nvidia-smi header (highest CUDA version the driver supports)"}
    normalise: "X.Y"
    consumers: [recipe, preflight]
  SUPPORTS_CUDA:
    group: gpu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources:
      linux: >-
        ON when a GPU<n>_VENDOR is nvidia (PCI vendor 0x10de, display class); not whether a CUDA toolkit is
        installed
      windows: "same"
    normalise: "ON/OFF"
    consumers: [preflight, generator]
  SUPPORTS_INTEL_XPU:
    group: gpu
    type: bool
    stability: stable
    perf: key
    platforms: [linux, windows]
    sources: {linux: "ON when a GPU<n>_VENDOR is intel", windows: "same"}
    normalise: "ON/OFF"
    consumers: [preflight]
  VULKAN:
    group: gpu
    type: bool
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos]
    sources:
      linux: >-
        ON when vulkaninfo --summary lists a device, or a Vulkan loader (libvulkan.so.1) is present together with a
        GPU (its driver ships the Vulkan ICD)
      windows: >-
        ON when vulkaninfo --summary lists a device, an AMD, Intel or NVIDIA display adapter is present (their drivers
        ship the Vulkan runtime) or vulkan-1.dll is in System32
      macos: "ON only when vulkaninfo lists a device (not probed today: OFF)"
    normalise: "ON/OFF"
    consumers: [recipe, ditto]
  VULKAN_DEVICES:
    group: gpu
    type: int
    min: 0
    max: 64
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos]
    sources: {any: "number of GPU entries in vulkaninfo --summary (CPU implementations such as llvmpipe not counted)"}
    normalise: "decimal integer"
    consumers: [recipe, ditto]
  VULKAN_INSTANCE_VERSION:
    group: gpu
    type: version
    pattern: '^\d{1,2}\.\d{1,3}\.\d{1,5}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      linux: >-
        the "Vulkan Instance Version: X.Y.Z" line of vulkaninfo --summary (exit code 0); without it the version in the
        file name of the Vulkan loader, libvulkan.so.1.Y.Z: the first file in /usr/lib/*, /usr/lib, /usr/lib64,
        /lib/*, /lib and /lib64 (the loader is built with VERSION = its loader version)
      windows: "the same line; without it the file version of %SystemRoot%\\System32\\vulkan-1.dll (X.Y.Z of X.Y.Z.W)"
    normalise: >-
      major.minor.patch: the highest Vulkan version an instance can be created with (the loader's); no loader and no
      vulkaninfo: left out without a warning
    consumers: [recipe, ditto, gui]
  OPENCL_PLATFORMS:
    group: gpu
    type: list
    item_pattern: '^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?:\d{1,2}\.\d{1,2}$'
    max_items: 16
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      any: >-
        clinfo without arguments (exit code 0): each "Platform Version" line, which holds CL_PLATFORM_VERSION
        ("OpenCL <major>.<minor> <platform text>" in the OpenCL specification), with the "Platform Name" line before
        it
    normalise: >-
      <name>:<OpenCL version> per platform in clinfo's order, no duplicates. The name: lower case, "(r)" and "(tm)"
      removed, every run of characters other than a-z and 0-9 one "-", no "-" at either end, at most 48 characters
      (NVIDIA CUDA -> nvidia-cuda:3.0, Intel(R) OpenCL Graphics -> intel-opencl-graphics:3.0). Without clinfo, when it
      fails or lists no platform: left out without a warning
    consumers: [recipe, gui, proposal]
  HIP_RUNTIME:
    group: gpu
    type: bool
    only_os: [linux]
    stability: stable
    perf: recorded
    platforms: [linux]
    sources: {linux: "libamdhip64 found by the dynamic loader", windows: "OFF (no self-built HIP on Windows)"}
    normalise: "ON/OFF"
    consumers: [recipe, ditto]
  ROCM_VERSION:
    group: gpu
    type: version
    only_os: [linux]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources: {linux: "/opt/rocm/.info/version, else hipconfig --version"}
    normalise: "leading dotted number"
    consumers: [recipe]
  ROCM_GFX_TARGETS:
    group: gpu
    type: list
    item_pattern: '^gfx[0-9a-f]{3,5}$'
    max_items: 16
    only_os: [linux]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        gfx_target_version of every KFD topology node (/sys/class/kfd/kfd/topology/nodes/*/properties, what
        rocminfo reads), also of compute devices that are not display controllers (an AMD Instinct card has PCI
        class 0x12, so it has no GPU<n> entry and no GPU<n>_GFX_TARGET)
    normalise: "LLVM target names (110003 -> gfx1103), each once, in the order of the nodes; no KFD: left out"
    consumers: [recipe, generator, preflight]
  CUDA_TOOLKIT_VERSION:
    group: gpu
    type: pattern
    pattern: '^\d{1,3}(\.\d{1,4}){1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        /usr/local/cuda/version.json, the "version" of its "cuda" object (installed by NVIDIA's package
        cuda-toolkit-<X>-<Y>: {"cuda": {"name": "CUDA SDK", "version": "12.6.3"}, ...}); else the "CUDA Version X.Y.Z"
        line of /usr/local/cuda/version.txt (toolkits before version.json); also on a Jetson, where nvcc is not on
        PATH; read only when the file exists
    normalise: >-
      the toolkit release (12.6.3), not the driver's CUDA level (NVIDIA_DRIVER_CUDA_MAX) and not nvcc's own version
      (TOOL_NVCC); a file without it: left out with not_determined:CUDA_TOOLKIT_VERSION
    consumers: [recipe, preflight, generator, gui]
  TENSORRT_VERSION:
    group: gpu
    type: pattern
    pattern: '^\d{1,2}\.\d{1,2}\.\d{1,2}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        the file name of the TensorRT runtime library libnvinfer.so.X.Y.Z (NVIDIA's packages install
        /usr/lib/<triplet>/libnvinfer*.so.X.Y.Z with the soname link .so.X): the first in /usr/lib/*, /usr/lib64 and
        /usr/lib; a tar install in the person's folder is not looked for
    normalise: "X.Y.Z; no library: left out without a warning"
    consumers: [recipe, preflight, generator, gui]
  OPENVINO_VERSION:
    group: gpu
    type: pattern
    pattern: '^\d{4}\.\d{1,2}\.\d{1,2}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: >-
        the file name of the OpenVINO runtime library libopenvino.so.YYYY.M.P (Intel's APT packages
        libopenvino-<version> install /usr/lib/libopenvino.so.2025.3.0 with the soname link libopenvino.so.2530): the
        first in /usr/lib, /usr/lib/* and /usr/lib64; an archive install under /opt/intel is not looked for
    normalise: "YYYY.M.P; no library: left out without a warning"
    consumers: [recipe, preflight, generator, gui]
  INTEL_GPU_DEVICE:
    group: gpu
    type: pattern
    # A render node only (a deploy step may pass it to `docker run --device`).
    pattern: '^/dev/dri/renderD[0-9]{1,3}$'
    only_os: [linux]
    required: false
    stability: stable
    perf: none
    platforms: [linux]
    sources:
      linux: >-
        the first /sys/class/drm/renderD<N> whose device has PCI vendor 0x8086 and the kernel driver i915 or xe (the
        node the OpenVINO GPU plugin and the oneAPI/SYCL runtimes open)
    normalise: "/dev/dri/renderD<N>"
    consumers: [deploy, preflight, recipe]
  INTEL_GPU_DRIVER:
    group: gpu
    type: enum
    values: [i915, xe]
    only_os: [linux]
    required: false
    stability: stable
    perf: recorded
    platforms: [linux]
    sources:
      linux: "the driver of INTEL_GPU_DEVICE (the name its /sys/class/drm/renderD<N>/device/driver link points to)"
    normalise: "the module name"
    consumers: [recipe, preflight, gui]
  METAL:
    group: gpu
    type: bool
    only_os: [macos]
    stability: stable
    perf: recorded
    platforms: [macos]
    sources: {macos: "ON on Apple Silicon and on Intel Macs with a Metal-capable GPU (system_profiler)"}
    normalise: "ON/OFF"
    consumers: [recipe, ditto]

  # --- toolchain: versions only, never paths (paths can contain the user name) -----------------------------
  TOOL_CC:
    group: toolchain
    type: pattern
    pattern: '^(gcc|clang|appleclang|msvc|icx)-\d{1,4}(\.\d{1,6}){0,3}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources:
      any: "cc --version (Windows: clang-cl --version, else cl without arguments); the compiler id from the banner"
    normalise: "<id>-<version>: gcc-12.2.0, clang-18.1.3, appleclang-16.0.0, msvc-19.44.35207"
    consumers: [recipe]
  TOOL_CXX:
    group: toolchain
    type: pattern
    pattern: '^(gcc|clang|appleclang|msvc|icx)-\d{1,4}(\.\d{1,6}){0,3}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources: {any: "c++ --version, as TOOL_CC"}
    normalise: "as TOOL_CC"
    consumers: [recipe]
  TOOL_CLANG:
    group: toolchain
    type: version
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos]
    sources: {any: "clang --version (Windows: clang-cl --version)"}
    normalise: "first dotted number of the first line"
    consumers: [recipe]
  TOOL_MSVC:
    group: toolchain
    type: version
    required: false
    stability: stable
    perf: none
    platforms: [windows]
    sources: {windows: "cl.exe banner in the environment of vcvarsall.bat (located with vswhere.exe)"}
