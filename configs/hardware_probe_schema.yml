# Hardware probe file format, schema 2: the one list of keys every probe writes and the framework reads.
#
# The probe runs on the machine that will run the binaries (a PC or a board) and writes target_hardware_config.txt.
# One parser reads it: orchestrator/runtime/profile.py. The parser loads this file, so the validation below is
# enforced, not only documented. Three emitters write exactly these keys: scripts/hardware_probe.py (PROBE_TOOL
# python, the main path) and the manual fallbacks scripts/hardware_probe.sh (sh, any POSIX shell) and
# scripts/hardware_probe.ps1 (ps1). The emitters carry a copy of the validation and tables below; tests compare them
# with this file and run the .py and .sh on the same fixture machines. Files of the older scripts (schema 1) are
# converted by the parser (see the end of this file).
#
# File rules (section "file"):
#   - UTF-8 (a byte order mark is accepted), LF line ends (CRLF is accepted); lines starting with "#" are comments.
#   - The first line that is not a comment or blank is PROBE_SCHEMA=2.
#   - KEY=VALUE, one per line. Keys match key_pattern and appear at most once.
#   - Values are one line, unquoted, at most max_value_length characters; lists are comma-separated without spaces.
#   - Every key of type bool is always written: ON, OFF or UNKNOWN. UNKNOWN means "this method cannot tell"; it is
#     never guessed from a model name.
#   - Any other fact the probe could not determine is left out (never written empty), and a code goes into
#     PROBE_WARNINGS (see tables.warning_codes).
#   - Per-GPU keys are indexed GPU0_*, GPU1_*, ... below GPU_COUNT (section "gpu_keys").
#   - The JSON view (hardware_probe.py --json, HardwareProfile.to_json()) has the same keys with the same string
#     values, PROBE_SCHEMA included.
#   - A key this file does not list is dropped by the parser and named in its notes; the value is never kept.
#
# Fields of a key:
#   group       where the key belongs (meta, system, cpu, x86, arm, memory, soc, npu, gpu, toolchain)
#   type        bool | enum | int | pattern | version | text | list | timestamp
#               bool: ON/OFF/UNKNOWN. enum: one of `values`. int: decimal, `min`..`max`. pattern/version: the value
#               fully matches `pattern` (version keys use patterns.version unless they set their own). text: free
#               text for display only, whitespace collapsed, no control characters, at most `max_length`
#               characters; free text never reaches a command line or a file name. list: comma-separated items, each
#               fully matching `item_pattern` (or one of `item_values`), at most `max_items`. timestamp: UTC ISO 8601
#               (2026-10-11T08:15:00Z).
#   required    written by every emitter on every OS (bool keys are always required)
#   stability   stable: kept in the profile store. volatile: changes from minute to minute; read live at each use and
#               never stored.
#   perf        key: enters perf_key (the hash that decides whether benchmark results still apply). recorded: stored
#               with every benchmark run; a change marks results "stale, re-measure suggested". none: neither.
#   platforms   where an emitter can determine the value (informational)
#   only_arch / only_os / only_gpu_vendor
#               the value only exists there: a bool must not be ON elsewhere, any other key must be absent elsewhere
#               (enforced)
#   os_values   enum values that only exist on the listed OS values (enforced)
#   sources     where each OS reads the value; normalise: how the raw value is turned into the written one
#   consumers   who reads the key (recipe = llama.cpp build recipe, ditto = Ditto's runtime and model tier,
#               generator = module generator, proposal = Ditto's module proposal, preflight = pre-flight check,
#               match = target matching, mcp = MCP tools, gui = display, bench = benchmarks, deploy = device deploy)
#   writer      framework: only the parser writes it (when it converts a schema 1 file), never an emitter

schema: 2

file:
  name: target_hardware_config.txt
  encoding: utf-8
  max_bytes: 131072
  max_value_length: 4096
  key_pattern: '^[A-Z][A-Z0-9_]{0,63}$'
  boolean_values: ["ON", "OFF", "UNKNOWN"]
  max_gpus: 16

patterns:
  version: '^\d{1,5}(\.\d{1,6}){0,3}$'
  identifier: '^[a-z0-9][a-z0-9._-]{0,31}$'

tables:
  # uname -m (lower case) -> ARCH. A 32-bit userland on a 64-bit kernel is written as the 32-bit ARCH (see ARCH).
  arch_aliases:
    x86_64: x86_64
    amd64: x86_64
    x64: x86_64
    x86-64: x86_64
    x86: x86
    i386: x86
    i486: x86
    i586: x86
    i686: x86
    arm64: arm64
    aarch64: arm64
    arm64e: arm64
    armv8l: armv7
    armv7: armv7
    armv7l: armv7
    armv7hl: armv7
    armhf: armv7
    armv6: armv6
    armv6l: armv6
    riscv64: riscv64
    ppc64le: ppc64le
    s390x: s390x
    loongarch64: loongarch64
  # The 32-bit counterpart of a 64-bit ARCH, for a 32-bit userland on a 64-bit kernel.
  arch_32bit_userland:
    x86_64: x86
    arm64: armv7
  x86_arches: [x86_64, x86]
  arm_arches: [arm64, armv7, armv6]
  # OS_FAMILY on Linux: OS_ID, then each OS_ID_LIKE entry in order, is looked up here; the first hit wins, else
  # "other". Other OS values have a fixed family (os_family_fixed).
  os_families:
    debian: [debian, ubuntu, raspbian, linuxmint, pop, elementary, kali, devuan, armbian, dietpi, zorin, neon,
             pureos, deepin, mx]
    rhel: [rhel, centos, rocky, almalinux, ol, amzn, scientific, eurolinux, cloudlinux, virtuozzo]
    fedora: [fedora]
    suse: [suse, opensuse, opensuse-leap, opensuse-tumbleweed, sles, sled, sle-micro]
    arch: [arch, archarm, manjaro, manjaro-arm, endeavouros, garuda, artix]
    alpine: [alpine, postmarketos]
    gentoo: [gentoo, funtoo]
    openwrt: [openwrt]
    void: [void]
    nixos: [nixos]
    slackware: [slackware]
  os_family_fixed:
    windows: windows
    macos: macos
    freebsd: bsd
    android: android
  # OS_VARIANT_ID on Linux when /etc/os-release has no VARIANT_ID: the first marker file that exists.
  os_variant_markers:
    /boot/dietpi/.version: dietpi
    /etc/armbian-release: armbian
  # x86 vendor_id (/proc/cpuinfo), VendorIdentifier (Windows registry), machdep.cpu.vendor (macOS), whitespace
  # trimmed -> CPU_VENDOR
  x86_vendors:
    GenuineIntel: intel
    AuthenticAMD: amd
    HygonGenuine: hygon
    CentaurHauls: centaur
    Shanghai: zhaoxin
  # ARM "CPU implementer" (/proc/cpuinfo) -> CPU_VENDOR
  arm_implementers:
    "0x41": arm
    "0x42": broadcom
    "0x43": cavium
    "0x46": fujitsu
    "0x48": hisilicon
    "0x4e": nvidia
    "0x50": apm
    "0x51": qualcomm
    "0x53": samsung
    "0x56": marvell
    "0x61": apple
    "0x66": faraday
    "0x69": intel
    "0x6d": microsoft
    "0x70": phytium
    "0xc0": ampere
  # "<implementer>:<part>" -> core name for CPU_MODEL on ARM Linux (the names lscpu prints). An unknown part is
  # written as "<implementer>:<part>" itself.
  arm_parts:
    "0x41:0xb76": ARM1176
    "0x41:0xc05": Cortex-A5
    "0x41:0xc07": Cortex-A7
    "0x41:0xc08": Cortex-A8
    "0x41:0xc09": Cortex-A9
    "0x41:0xc0d": Cortex-A17
    "0x41:0xc0f": Cortex-A15
    "0x41:0xd01": Cortex-A32
    "0x41:0xd02": Cortex-A34
    "0x41:0xd03": Cortex-A53
    "0x41:0xd04": Cortex-A35
    "0x41:0xd05": Cortex-A55
    "0x41:0xd06": Cortex-A65
    "0x41:0xd07": Cortex-A57
    "0x41:0xd08": Cortex-A72
    "0x41:0xd09": Cortex-A73
    "0x41:0xd0a": Cortex-A75
    "0x41:0xd0b": Cortex-A76
    "0x41:0xd0c": Neoverse-N1
    "0x41:0xd0d": Cortex-A77
    "0x41:0xd0e": Cortex-A76AE
    "0x41:0xd40": Neoverse-V1
    "0x41:0xd41": Cortex-A78
    "0x41:0xd42": Cortex-A78AE
    "0x41:0xd43": Cortex-A65AE
    "0x41:0xd44": Cortex-X1
    "0x41:0xd46": Cortex-A510
    "0x41:0xd47": Cortex-A710
    "0x41:0xd48": Cortex-X2
    "0x41:0xd49": Neoverse-N2
    "0x41:0xd4a": Neoverse-E1
    "0x41:0xd4b": Cortex-A78C
    "0x41:0xd4c": Cortex-X1C
    "0x41:0xd4d": Cortex-A715
    "0x41:0xd4e": Cortex-X3
    "0x41:0xd4f": Neoverse-V2
    "0x41:0xd80": Cortex-A520
    "0x41:0xd81": Cortex-A720
    "0x41:0xd82": Cortex-X4
    "0x41:0xd84": Neoverse-V3
    "0x41:0xd85": Cortex-X925
    "0x41:0xd87": Cortex-A725
    "0x41:0xd8e": Neoverse-N3
  # PCI vendor id -> GPU<n>_VENDOR (anything else: other)
  pci_vendors:
    "0x10de": nvidia
    "0x1002": amd
    "0x1022": amd
    "0x8086": intel
    "0x106b": apple
    "0x13b5": arm
    "0x5143": qualcomm
    "0x1010": imagination
    "0x14e4": broadcom
  # SOC_MODEL values the framework takes decisions on; any other value that matches the pattern is display only.
  soc_models_known: [rk3399, rk3528, rk3562, rk3566, rk3568, rk3576, rk3588, rk3588s]
  # SMBIOS memory type (Windows Win32_PhysicalMemory.SMBIOSMemoryType, dmidecode) -> RAM_TYPE
  smbios_memory_types:
    24: DDR3
    26: DDR4
    29: LPDDR3
    30: LPDDR4
    34: DDR5
    35: LPDDR5
  # Rockchip USB product id (vendor 0x2207) -> USB_ROCKCHIP_MODE, as today's scripts map it (unverified on a device;
  # in Rockusb mode the USB descriptor, not the product id, tells maskrom from loader).
  usb_rockchip_pids:
    "0x350a": rockusb
    "0x350b": rockusb
    "0x0006": adb-mtp
    "0x0019": adb
  # Hailo accelerators (HAILO_PLAN.md section 2.2). hailortcli fw-control identify's "Device Architecture:" word (upper
  # case, looked up exactly: HAILO8 is part of HAILO8L) -> HAILO_ARCH. The words are those of fw_control_command.cpp of
  # both HailoRT branches; HAILO8_B0 appears only in older sample outputs and is kept for old releases.
  hailo_arch_names:
    HAILO8: hailo8
    HAILO8_B0: hailo8
    HAILO8L: hailo8l
    HAILO10H: hailo10h
    HAILO15H: hailo15h      # on a PCIe or USB device -> hailo10h (see HAILO_ARCH)
    HAILO15M: hailo15m
    HAILO15L: hailo15l
    HAILO12L: hailo12l
    MARS: hailo12l          # the master branch prints MARS for HAILO_ARCH_HAILO12L
  # HAILO_ARCH -> HAILO_FAMILY: hailo8 = HailoRT 4.x (branch hailo8), hailo1x = HailoRT 5.x (branch master)
  hailo_arch_family:
    hailo8: hailo8
    hailo8l: hailo8
    hailo10h: hailo1x
    hailo15h: hailo1x
    hailo15m: hailo1x
    hailo15l: hailo1x
    hailo12l: hailo1x
  # Kernel module (/sys/module/<name>) -> HAILO_FAMILY, in the order they are looked for (hailort-drivers)
  hailo_drivers:
    hailo_pci: hailo8
    hailo1x_pci: hailo1x
    hailo_integrated_nnc: hailo1x
  # sysfs class (/sys/class/<name>/<entry>; the node is /dev/<entry>) -> HAILO_FAMILY, in this order
  hailo_sysfs_classes:
    hailo_chardev: hailo8
    hailo1x: hailo1x
    hailo1x_integrated: hailo1x
  # PCI vendor:device -> HAILO_FAMILY (the drivers' pci_device_id tables). Hailo-8 and 8L share 0x2864, so a PCI id
  # never sets HAILO_ARCH.
  hailo_pci_devices:
    "0x1e60:0x2864": hailo8
    "0x1e60:0x45c4": hailo1x
    "0x1e60:0x43a2": hailo1x
    "0x1e60:0x26a2": hailo1x
  # USB vendor:product -> HAILO_ARCH (HailoRT's install_usb.sh: the ASUS UGen300 USB AI Accelerator, a Hailo-10H)
  hailo_usb_devices:
    "0x0b05:0x1d6f": hailo10h
  # Codes in PROBE_WARNINGS: "<code>" or "<code>:<KEY>". Unknown codes are accepted (display only) if they match
  # the item pattern of PROBE_WARNINGS.
  warning_codes:
    not_determined: the key could not be read on this machine and was left out
    needs_root: the value is readable only with root or administrator rights and was left out
    unknown_arm_part: an ARM core is not in tables.arm_parts; CPU_MODEL names it by implementer and part
    emulated: the probe ran under emulation; ARCH is the native architecture
    converted_from_schema_1: written by the framework from a schema 1 file (today's .sh/.ps1 output)
    reprobe_before_build: the profile lacks facts a build needs; run the probe again on the machine
    cpu_features_unknown: the CPU features of the source file are unreliable and were set to UNKNOWN
    version_mismatch: two parts of an installed vendor runtime report different versions; the key was left out
  consumers: [recipe, ditto, generator, proposal, preflight, match, mcp, gui, bench, deploy]

keys:
  # --- meta ---------------------------------------------------------------------------------------------------
  PROBE_SCHEMA:
    group: meta
    type: enum
    values: ["2"]
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources: {any: "constant of the emitter; the first line that is not a comment"}
    normalise: none
    consumers: [recipe, ditto, mcp]
  PROBE_TOOL:
    group: meta
    type: enum
    values: [python, sh, ps1]
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources: {any: "constant of the emitter (hardware_probe.py, .sh, .ps1)"}
    normalise: none
    consumers: [gui, mcp]
  PROBE_TOOL_VERSION:
    group: meta
    type: version
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources: {any: "constant of the emitter"}
    normalise: >-
      none. A new key is a schema change and raises the version (3.0.0 -> 3.1.0); new keys are never required and
      never ON/OFF keys, so a file of an older version, which lacks them, is read as it is
    consumers: [gui, mcp]
  PROBE_CONVERTED_FROM:
    group: meta
    type: enum
    values: ["1"]
    required: false
    stability: stable
    perf: none
    writer: framework
    platforms: [linux, windows, macos, freebsd, android]
    sources: {any: "written by the parser when it converts a schema 1 file; required keys may then be missing"}
    normalise: none
    consumers: [recipe, gui, mcp]
  GENERATED_AT:
    group: meta
    type: timestamp
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "date -u +%Y-%m-%dT%H:%M:%SZ; Python datetime.now(timezone.utc)"
      windows: "(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')"
      macos: "date -u +%Y-%m-%dT%H:%M:%SZ"
    normalise: "UTC, whole seconds, suffix Z"
    consumers: [gui, mcp]
  PROBE_WARNINGS:
    group: meta
    type: list
    item_pattern: '^[a-z][a-z0-9_]{0,47}(:[A-Z][A-Z0-9_]{0,63})?$'
    max_items: 128
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources: {any: "codes of tables.warning_codes collected while probing"}
    normalise: "in the order they occurred, no duplicates"
    consumers: [gui, mcp, preflight]

  # --- system -------------------------------------------------------------------------------------------------
  OS:
    group: system
    type: enum
    values: [linux, windows, macos, freebsd, android]
    required: true
    stability: stable
    perf: key
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "Python platform.system(); shell uname -s"
      windows: "constant of the .ps1; Python platform.system()"
      macos: "Python platform.system() (Darwin)"
      android: "Python sys.platform == 'android' or getprop present; shell: /system/build.prop exists"
    normalise: "lower case; Darwin -> macos"
    consumers: [recipe, ditto, deploy, match]
  OS_ID:
    group: system
    type: pattern
    pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "ID= of /etc/os-release (fallback /usr/lib/os-release)"
      windows: "constant windows"
      macos: "constant macos"
      freebsd: "ID= of /etc/os-release"
      android: "constant android"
    normalise: "quotes removed, lower case"
    consumers: [recipe, deploy, gui]
  OS_ID_LIKE:
    group: system
    type: list
    item_pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    max_items: 16
    required: false
    stability: stable
    perf: none
    platforms: [linux, freebsd]
    sources:
      linux: "ID_LIKE= of /etc/os-release"
    normalise: "quotes removed, lower case, spaces become commas"
    consumers: [deploy]
  OS_FAMILY:
    group: system
    type: enum
    values: [debian, rhel, fedora, suse, arch, alpine, gentoo, openwrt, void, nixos, slackware, other, windows,
             macos, bsd, android]
    os_values: {windows: [windows], macos: [macos], bsd: [freebsd], android: [android]}
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "OS_ID, then each OS_ID_LIKE entry, looked up in tables.os_families; first hit wins, else other"
      windows: "tables.os_family_fixed"
      macos: "tables.os_family_fixed"
    normalise: "table lookup"
    consumers: [recipe, deploy]
  OS_VARIANT_ID:
    group: system
    type: pattern
    pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux]
    sources:
      linux: "VARIANT_ID= of /etc/os-release, else the first file of tables.os_variant_markers that exists"
    normalise: "quotes removed, lower case"
    consumers: [deploy, gui]
  OS_VERSION_ID:
    group: system
    type: pattern
    pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,31}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "VERSION_ID= of /etc/os-release (left out on rolling releases without it)"
      windows: "major.minor.build from RtlGetVersion / [Environment]::OSVersion.Version (no revision)"
      macos: "sw_vers -productVersion; Python platform.mac_ver()[0]"
      android: "getprop ro.build.version.release"
    normalise: "quotes removed"
    consumers: [recipe, deploy, gui]
  OS_VERSION_CODENAME:
    group: system
    type: pattern
    pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    required: false
    stability: stable
    perf: none
    platforms: [linux]
    sources:
      linux: "VERSION_CODENAME= of /etc/os-release"
    normalise: "quotes removed, lower case"
    consumers: [recipe, deploy]
  OS_PRETTY_NAME:
    group: system
    type: text
    max_length: 128
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "PRETTY_NAME= of /etc/os-release"
      windows: >-
        ProductName of HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion, with "Windows 10" changed to "Windows 11"
        when CurrentBuildNumber is 22000 or higher (Windows 11 still writes "Windows 10" into ProductName)
      macos: "'macOS ' + sw_vers -productVersion"
    normalise: "quotes removed, whitespace trimmed and collapsed"
    consumers: [gui, proposal]
  KERNEL:
    group: system
    type: pattern
    pattern: '^[A-Za-z0-9][A-Za-z0-9._+~-]{0,63}$'
    required: true
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "uname -r; Python platform.release()"
      windows: "major.minor.build of the NT kernel (same source as OS_VERSION_ID)"
      macos: "uname -r (Darwin release)"
    normalise: none
    consumers: [gui, preflight]
  KERNEL_ARCH:
    group: system
    type: enum
    values: [x86_64, x86, arm64, armv7, armv6, riscv64, ppc64le, s390x, loongarch64, other]
    required: false
    stability: stable
    perf: none
    platforms: [linux, freebsd, android]
    sources:
      linux: "uname -m; Python os.uname().machine"
    normalise: "lower case, then tables.arch_aliases; not in the table -> other"
    consumers: [gui, preflight]
  ARCH:
    group: system
    type: enum
    values: [x86_64, x86, arm64, armv7, armv6, riscv64, ppc64le, s390x, loongarch64, other]
    required: true
    stability: stable
    perf: key
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: >-
        uname -m through tables.arch_aliases; when the userland is 32-bit (Python struct.calcsize('P') == 4, shell
        getconf LONG_BIT = 32) on a 64-bit kernel, the 32-bit counterpart of tables.arch_32bit_userland (binaries
        must match the userland, not the kernel)
      windows: "native machine of IsWow64Process2 (an emulated x64 process on ARM64 still writes arm64)"
      macos: "sysctl hw.optional.arm64 = 1 -> arm64 (also under Rosetta), else x86_64"
    normalise: "lower case, then tables.arch_aliases; not in the table -> other (no build is planned for other)"
    consumers: [recipe, ditto, generator, match, deploy, mcp]
  LIBC:
    group: system
    type: enum
    values: [glibc, musl, uclibc, bionic, ucrt, libsystem, bsdlibc]
    os_values: {glibc: [linux], musl: [linux], uclibc: [linux], bionic: [android, linux], ucrt: [windows],
                libsystem: [macos], bsdlibc: [freebsd]}
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: >-
        Python os.confstr('CS_GNU_LIBC_VERSION') or shell getconf GNU_LIBC_VERSION -> glibc; else a musl loader
        /lib/ld-musl-*.so.1 exists -> musl; else /lib/ld-uClibc.so.* -> uclibc
      windows: "constant ucrt"
      macos: "constant libsystem"
      android: "constant bionic"
    normalise: "table above; left out with not_determined:LIBC when no rule matches"
    consumers: [recipe, deploy, preflight]
  LIBC_VERSION:
    group: system
    type: version
    pattern: '^\d{1,3}(\.\d{1,5}){1,3}$'
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows]
    sources:
      linux: >-
        glibc: the version part of CS_GNU_LIBC_VERSION / getconf GNU_LIBC_VERSION ("glibc 2.36" -> 2.36). musl: the
        "Version" line the musl loader prints when run without arguments
      windows: "file version of %SystemRoot%\\System32\\ucrtbase.dll, when readable"
    normalise: "digits and dots only"
    consumers: [recipe, deploy, preflight]
  INIT_SYSTEM:
    group: system
    type: enum
    values: [systemd, openrc, sysvinit, busybox, runit, s6, procd, launchd, scm, bsdinit, other]
    os_values: {systemd: [linux], openrc: [linux], sysvinit: [linux], busybox: [linux], runit: [linux],
                s6: [linux], procd: [linux], launchd: [macos], scm: [windows], bsdinit: [freebsd]}
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos, freebsd]
    sources:
      linux: >-
        first match: /run/systemd/system is a directory -> systemd; /run/openrc -> openrc; /run/runit or
        /etc/runit/runsvdir -> runit; /run/s6 or /run/s6-rc -> s6; /sbin/procd -> procd; /proc/1/comm is init and
        /sbin/init links to busybox -> busybox; /proc/1/comm is init and /etc/inittab exists -> sysvinit; else other
      windows: "constant scm (service control manager)"
      macos: "constant launchd"
      freebsd: "constant bsdinit"
    normalise: "first matching rule"
    consumers: [deploy]

  # --- CPU identity -------------------------------------------------------------------------------------------
  CPU_MODEL:
    group: cpu
    type: text
    max_length: 128
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: >-
        x86 and 32-bit ARM: "model name" of the first processor in /proc/cpuinfo. arm64: the core names of
        CPU_CLUSTERS (tables.arm_parts), each name once, in the order of their first CPU, joined with "+"
        (RK3566: Cortex-A55; RK3588: Cortex-A55+Cortex-A76)
      windows: >-
        ProcessorNameString of HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor\0 (not platform.processor(),
        which gives "Intel64 Family ..." there)
      macos: "sysctl machdep.cpu.brand_string"
    normalise: "whitespace trimmed and collapsed to single spaces"
    consumers: [gui, generator, proposal, bench]
  CPU_VENDOR:
    group: cpu
    type: enum
    values: [intel, amd, hygon, centaur, zhaoxin, arm, broadcom, cavium, fujitsu, hisilicon, nvidia, apm, qualcomm,
             samsung, marvell, apple, faraday, microsoft, phytium, ampere, other]
    required: false
    stability: stable
    perf: key
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: >-
        x86: vendor_id via tables.x86_vendors; ARM: CPU implementer of the first processor via
        tables.arm_implementers
      windows: "VendorIdentifier of the CentralProcessor\\0 registry key via tables.x86_vendors; ARM64 PCs: left out"
      macos: "x86: sysctl machdep.cpu.vendor via tables.x86_vendors; arm64: constant apple"
    normalise: "table lookup; not in the table -> other"
    consumers: [recipe, bench, gui]
  CPU_CORES_LOGICAL:
    group: cpu
    type: int
    min: 1
    max: 4096
    required: true
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos, freebsd, android]
    sources:
      linux: "number of processor entries in /proc/cpuinfo; Python os.cpu_count()"
      windows: "NumberOfLogicalProcessors of Win32_Processor (summed over sockets); Python os.cpu_count()"
      macos: "sysctl hw.logicalcpu"
    normalise: "decimal integer"
    consumers: [recipe, bench, ditto]
  CPU_CORES_PHYSICAL:
    group: cpu
    type: int
    min: 1
    max: 4096
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos]
    sources:
      linux: "distinct (physical id, core id) pairs in /proc/cpuinfo; on ARM without them: CPU_CORES_LOGICAL"
      windows: "NumberOfCores of Win32_Processor (summed over sockets)"
      macos: "sysctl hw.physicalcpu"
    normalise: "decimal integer"
    consumers: [bench, ditto]
  CPU_CLUSTERS:
    group: cpu
    type: list
    item_pattern: '^\d{1,4}(-\d{1,4})?:0x[0-9a-f]{2}:0x[0-9a-f]{3}(:\d{1,5})?$'
    max_items: 64
    only_arch: [arm64, armv7, armv6]
    required: false
    stability: stable
    perf: key
    platforms: [linux, android]
    sources:
      linux: >-
        per logical CPU: "CPU implementer" and "CPU part" of /proc/cpuinfo and
        /sys/devices/system/cpu/cpu<N>/cpufreq/cpuinfo_max_freq (kHz); CPUs with the same implementer, part and
        maximum frequency form a cluster
    normalise: >-
      "<cpus>:<implementer>:<part>:<max MHz>", for example 0-3:0x41:0xd05:1800,4-7:0x41:0xd0b:2400 (RK3588). cpus is
      one CPU or a contiguous range (a non-contiguous group is written as several entries); implementer 2 and part 3
      lower-case hex digits; MHz = kHz // 1000, left out (with its colon) when unreadable; entries ordered by their
      first CPU. x86 has no clusters (hybrid Intel cores are not described)
    consumers: [bench, recipe]
  CPU_FLAGS_ALL:
    group: cpu
    type: list
    item_pattern: '^[a-z0-9_.]{1,48}$'
    max_items: 1024
    required: false
    stability: stable
    perf: none
    platforms: [linux, macos, android]
    sources:
      linux: "\"flags\" (x86) or \"Features\" (ARM) line of the first processor in /proc/cpuinfo"
      macos: "sysctl machdep.cpu.features and machdep.cpu.leaf7_features (x86); left out on arm64"
    normalise: "lower case, split on whitespace, joined with commas in the original order, no duplicates"
    consumers: [proposal, gui]
  CPU_FLAGS_SOURCE:
    group: cpu
    type: enum
    values: [proc-cpuinfo, sysctl, windows-api]
    required: false
    stability: stable
    perf: none
    platforms: [linux, windows, macos, android]
    sources:
      linux: "constant proc-cpuinfo when /proc/cpuinfo was read"
      windows: "constant windows-api (IsProcessorFeaturePresent)"
      macos: "constant sysctl"
    normalise: "where the SUPPORTS_* CPU features came from"
    consumers: [recipe, gui]
  CPU_L2_CACHE_KB:
    group: cpu
    type: int
    min: 1
    max: 1048576
    required: false
    stability: stable
    perf: recorded
    platforms: [linux, windows, macos, android]
    sources:
      linux: >-
        /sys/devices/system/cpu/cpu<N>/cache/index<M>/ whose level is 2 and whose type is Unified or Data: its size
        (the kernel writes KiB, "2048K")
      windows: "GetLogicalProcessorInformation: the level-2 unified or data caches (RelationCache)"
      macos: "sysctl hw.perflevel0.l2cachesize, hw.perflevel1.l2cachesize and hw.l2cachesize (bytes)"
    normalise: >-
      KiB of the largest level-2 cache (one cache: a cache several cores share counts once, at its full size). A CPU
      whose caches list no level 2 (many Cortex-A55 boards have only L1 and L3) has no value and no warning; a level-2
      cache whose size cannot be read, or a Windows that cannot tell: left out with not_determined:CPU_L2_CACHE_KB
    consumers: [bench, gui, proposal]

  # --- x86 CPU features: exactly ggml's x86 options at the pinned llama.cpp commit -----------------------------
  # Linux: ON if every token of cpuinfo is in CPU_FLAGS_ALL, else OFF; UNKNOWN when /proc/cpuinfo has no flags.
  # Windows: IsProcessorFeaturePresent(windows_feature) TRUE -> ON; FALSE -> OFF only on Windows builds from
  # windows_min_build on (older builds return FALSE for constants they do not know: UNKNOWN). The thresholds are
  # conservative and unverified: below them a FALSE costs speed (UNKNOWN), never a wrong ON. No constant -> UNKNOWN.
  # macOS (x86): the sysctl token in machdep.cpu.features / leaf7_features.
  # Non-x86 ARCH: OFF.
  SUPPORTS_SSE42:
    group: x86
    type: bool
    cpuinfo: [sse4_2]
    windows_feature: 38
    windows_min_build: 22000
    macos_sysctl: SSE4.2
    only_arch: [x86_64, x86]
    stability: stable
    perf: key
    platforms: [linux, windows, macos]
    sources: {linux: "/proc/cpuinfo flags sse4_2", windows: "PF_SSE4_2_INSTRUCTIONS_AVAILABLE (38)", macos: "SSE4.2"}
    normalise: "see the rule above"
    consumers: [recipe]
