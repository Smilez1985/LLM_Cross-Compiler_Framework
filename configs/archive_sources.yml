# What Ditto's archive treats as a source (read by orchestrator/utils/archive_sources.py and
# orchestrator/Core/archive_extractors.py; docs/DESIGN.md, Ditto, the archive's rows).
#
# listen     the tools whose successful results the archive is offered (an extractor per tool decides whether an entry
#            comes of it; a tool that is not listed here teaches the archive nothing).
# suffixes   public suffixes of two parts (co.uk, com.cn, ...): a host below one of them is a different site from its
#            neighbour, so its registrable domain has three labels. A small table, not the whole public suffix list;
#            a missing one makes two sites of that suffix count as one source, never as two.
# vendors    one row per manufacturer whose website counts as the ground "vendor": its name, the registrable domains
#            of its websites, the target ids (targets/<id>) it speaks for and the chips (SoCs and NPUs, as closed words:
#            letters, digits, dot, dash, underscore) its boards or accelerators build on, as its own pages say. A row
#            needs at least one target or one chip. A new vendor is a row, not code.
#            Researched on 2026-11-13 (the pages named in docs/DESIGN.md, round 94); the domain of SunFounder was not
#            confirmed by that search and is the one its products and documentation are known by.

version: 1

listen:
  - get_artifact_details
  - search_knowledge
  - read_knowledge_source

suffixes:
  - ac.uk
  - co.jp
  - co.kr
  - co.uk
  - com.au
  - com.br
  - com.cn
  - com.hk
  - com.tw
  - edu.cn
  - gov.cn
  - net.cn
  - org.cn
  - org.uk

vendors:
  - vendor: Radxa
    domains: [radxa.com]
    targets: [Rockchip]
    chips: [RK3588, CD8180]
  - vendor: Rockchip
    domains: [rock-chips.com]
    targets: [Rockchip]
    chips: [RK3588, RK3576, RK3566]
  - vendor: Orange Pi
    domains: [orangepi.org]
    targets: [Rockchip]
    chips: [RK3588, CD8180]
  - vendor: CIX
    domains: [cixtech.com]
    chips: [CD8180, CD8160, Zhouyi-Z3]
  - vendor: Hailo
    domains: [hailo.ai]
    chips: [Hailo-8L, Hailo-8, Hailo-8R, Hailo-10H, Hailo-15H, Hailo-15L]
  - vendor: Axelera AI
    domains: [axelera.ai]
    chips: [Metis, RK3588]
  - vendor: SunFounder
    domains: [sunfounder.com]
    chips: [BCM2712, BCM2711]
  - vendor: NVIDIA
    domains: [nvidia.com]
    chips: [GeForce-RTX, Jetson-Orin, Jetson-Thor]
  - vendor: AMD
    domains: [amd.com]
    chips: [Radeon-RX-9000, Radeon-RX-7000, Radeon-AI-PRO, Instinct-MI300, Instinct-MI350, Ryzen-AI-XDNA]
  - vendor: Apple
    domains: [apple.com]
    chips: [Apple-Silicon, Neural-Engine]
  - vendor: Banana Pi
    domains: [banana-pi.org]
    chips: [RK3588, RK3576, SpacemiT-K1, K230D]
