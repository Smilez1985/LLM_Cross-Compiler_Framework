      cuda: "12.8"
      min_driver: "525.60.13"
      jit_min_driver: "570.26"
      native_compute_caps: [8.6, 8.7, 8.9, 12.0]
      min_compute_cap: 5.0
      files:
        - {name: llama-b11429-bin-ubuntu-cuda-12.8-x64.tar.gz, size: 171651873, sha256: b13c64b9224d3c89d9993945d70cc21177ad00178c21b8d34237e3bc139834f1}
        - {name: cudart-llama-b11429-bin-ubuntu-cuda-12.8-x64.tar.gz, size: 594377569, sha256: f4ab593e31507320b121f2cb21791f4c72420a2483d3df8bf2ca1a97d04e6845, libs: true}
