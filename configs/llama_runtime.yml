# Automatic tier choice: the first rule whose conditions hold AND whose model fits next to the system
# (weights + minimum context + 1.5 GiB for the OS and the framework) wins; the last rule needs no
# conditions and is used even if nothing fits. Sizes in GiB (machines sold with 4 GB report about
# 3.6-3.9 GiB). VRAM counts only for a dedicated GPU used by the chosen build, and for Apple Silicon
# (Metal may use about two thirds of the unified memory); integrated AMD/Intel GPUs share the RAM.
tier_rules:
  - {tier: large, min_vram_gib: 7.5}
  - {tier: small-q2, max_ram_gib: 3.0}
  - {tier: small, max_ram_gib: 4.5}
  - {tier: default}
  - {tier: small}      # fallbacks when the model above does not fit
  - {tier: small-q2}
