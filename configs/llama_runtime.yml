# Managed local LLM runtime for Ditto's offline mode: a pinned llama.cpp build (llama-server) and
# pinned GGUF models. This file is data: a newer build or another model is added here, not in code.
#
# Every download needs a pinned sha256 AND size and is verified before it is unpacked or used; entries
# without them are refused (fail closed). Models are pinned to a Hugging Face commit, never to a branch.
#
# Sources (checked 2026-10-10):
# - llama.cpp assets: names and sizes from the release download URLs of tag b11429 (the v0.6.0 tag
#   points at the same commit; binaries are only published under the b-number). The sha256 values were
#   computed from complete, TLS-verified downloads of each asset and checked again by a second, independent
#   download. To cross-check:
#   gh api repos/ggml-org/llama.cpp/releases/tags/b11429 --jq '.assets[] | [.name, .digest] | @tsv'
# - CUDA architectures: ggml/src/ggml-cuda/CMakeLists.txt at the tag (the release workflow sets none, so
#   the default list applies): PTX only ("-virtual") for 5.0, 6.1, 7.0 (CUDA 12 only), 7.5, 8.0 and 9.0;
#   native code for 8.6 (also runs on 8.7 and 8.9), 8.9, 12.0 (CUDA >= 12.8) and 12.1 (CUDA >= 12.9).
# - Driver versions: CUDA Toolkit release notes (tables 2-4) and the CUDA compatibility guide. Minor
#   version compatibility lets a build run on an older driver of the same major release (13.x: >= 580,
#   12.x: >= 525), but "applications that compile device code to PTX will not work on older drivers":
#   a GPU that only gets PTX (e.g. Turing, RTX 2080 Ti, compute 7.5) needs the toolkit's own driver
#   (CUDA 13.4: branch R615; 12.8 GA: 570.26 Linux; 12.4 GA: 551.61 Windows).
# - ROCm gpu_targets: GPU_TARGETS of the ubuntu-24-rocm and windows-rocm jobs in the release workflow.
# - Models: HfApi().model_info(repo, revision, files_metadata=True) -> siblings[].lfs.sha256 and size.
schema_version: 1

llama_cpp:
  build: b11429
  version: "0.6.0"
  # The one llama.cpp pin. Every self-built llama.cpp (Ditto's server, the conversion tools, device runtimes; the
  # recipe in orchestrator/runtime/build/) is built from exactly this commit: a tag can be moved, a commit cannot,
  # so the source is checked out by commit and `git rev-parse HEAD` must give it back. The tag (always the same as
  # `build`) is the label: the pin-bump check compares `git ls-remote <repo> refs/tags/<tag>` with the commit, and
  # the target images clone this tag until they verify the commit themselves (setting llama_cpp_version, the ARG
  # LLAMA_CPP_TAG of targets/Rockchip/dockerfile; tests/test_build_recipe.py checks every place against this one).
  # Checked with git ls-remote on 2026-10-11: refs/tags/b11429 = refs/tags/v0.6.0^{} = the commit below.
  source:
    repo: https://github.com/ggml-org/llama.cpp.git
    commit: d81235049384534c167caea52b85a694f6103d14
    tag: b11429
    build_number: 11429
  # The official prebuilt archives below are what `llm-cli ditto runtime install` downloads until the self-built
  # runtime replaces it; afterwards they are only used on explicit request, labelled "not self-built" (decision D1).
  base_url: https://github.com/ggml-org/llama.cpp/releases/download/b11429/
  # Server options that exist in this build (checked in tools/server and common/arg.cpp at the tag).
  features:
    sleep_idle_seconds: true
    fit: true
  # Driver versions are quoted strings and compared part by part ("570.124" is newer than "570.26").
  # Files with libs: true (CUDA runtime libraries) are moved next to llama-server after unpacking.
  assets:
    # --- Linux x86_64 ---
    - id: linux-x64-cpu
      os: linux
      arch: x86_64
      backend: cpu
      files:
        - {name: llama-b11429-bin-ubuntu-x64.tar.gz, size: 17693462, sha256: f6d25dde8f51133143d1453da4fd5f73b145127177612a283bf7995957af3392}
    - id: linux-x64-vulkan
      os: linux
      arch: x86_64
      backend: vulkan
      files:
        - {name: llama-b11429-bin-ubuntu-vulkan-x64.tar.gz, size: 31636673, sha256: 632c4e98feba2b94407a2130e3133e0c3aefb0ea1ab41337e926d8bfafdd0b74}
    - id: linux-x64-cuda-13.4
      os: linux
      arch: x86_64
      backend: cuda
      cuda: "13.4"
      min_driver: "580"
      jit_min_driver: "615"
      native_compute_caps: [8.6, 8.7, 8.9, 12.0, 12.1]
      min_compute_cap: 7.5
      files:
        - {name: llama-b11429-bin-ubuntu-cuda-13.4-x64.tar.gz, size: 152519318, sha256: 8082b7eaa74a714c9fecca19128f751c8e32da763ee8096b8ad1e824da7621d3}
        - {name: cudart-llama-b11429-bin-ubuntu-cuda-13.4-x64.tar.gz, size: 440236630, sha256: 93d18648d815b2bd624d83d82f653e1db97afb478f02064305fe3cf570040a6d, libs: true}
    - id: linux-x64-cuda-12.8
      os: linux
