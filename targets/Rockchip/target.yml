---
# LLM Cross-Compiler Framework - Rockchip Target Configuration
# Professional target definition for Radxa/Rockchip hardware family

metadata:
  name: "Rockchip Family"
  description: "Cross-compilation for Radxa and Rockchip SoC boards (RK3566, RK3588, RK3576, RK3568)"
  maintainer: "LLM Framework Core Team"
  version: "1.0.0"
  created: "2024-11-03"
  updated: "2024-11-03"
  
  # Target classification
  category: "embedded_soc"
  architecture_family: "aarch64"
  vendor: "rockchip"
  
  # Documentation links
  documentation_url: "https://docs.radxa.com/"
  community_url: "https://forum.radxa.com/"
  datasheet_url: "https://www.rock-chips.com/a/en/products/"

# Supported hardware boards
supported_boards:
  - name: "RK3566"
    description: "Quad-core ARM Cortex-A55, Mali-G52 GPU"
    specifications:
      cpu_cores: 4
      cpu_arch: "cortex-a55"
      cpu_max_freq: "1.8GHz"
      gpu: "Mali-G52"
      npu: "1 TOPS"
      memory_max: "8GB LPDDR4"
      typical_boards: ["Radxa ZERO 3W", "Radxa CM3", "ROCK 3C"]
      
  - name: "RK3568" 
    description: "Quad-core ARM Cortex-A55, Mali-G52 GPU"
    specifications:
      cpu_cores: 4
      cpu_arch: "cortex-a55"
      cpu_max_freq: "2.0GHz"
      gpu: "Mali-G52"
      npu: "1 TOPS"
      memory_max: "8GB LPDDR4"
      typical_boards: ["ROCK 3A", "Radxa E25"]
      
  - name: "RK3576"
    description: "Octa-core ARM (4xA72 + 4xA53), Mali-G52 GPU" 
    specifications:
      cpu_cores: 8
      cpu_arch: "big-little"
      cpu_big: "4x cortex-a72"
      cpu_little: "4x cortex-a53" 
      cpu_max_freq: "2.2GHz"
      gpu: "Mali-G52"
      npu: "6 TOPS"
      memory_max: "16GB LPDDR5"
      typical_boards: ["ROCK 4D"]
      
  - name: "RK3588"
    description: "Octa-core ARM (4xA76 + 4xA55), Mali-G610 GPU"
    specifications:
      cpu_cores: 8
      cpu_arch: "big-little"
      cpu_big: "4x cortex-a76"
      cpu_little: "4x cortex-a55"
      cpu_max_freq: "2.4GHz" 
      gpu: "Mali-G610"
      npu: "6 TOPS"
      memory_max: "32GB LPDDR5"
      typical_boards: ["ROCK 5B", "Radxa CM5", "Orange Pi 5"]

# Docker configuration
docker:
  image_name: "llm-framework/rockchip"
  registry: "ghcr.io"
  build_context: "."
  dockerfile: "Dockerfile"
  
  # Build arguments
  build_args:
    LLAMA_CPP_TAG: "v0.6.0"
    BUILD_JOBS: "4"
    PYTHON_VERSION: "3.11"
    
  # Image tags
  tags:
    - "latest"
    - "v1.0.0"
    - "stable"
  
  # Resource requirements for building
  build_requirements:
    memory_gb: 8
    disk_gb: 20
    cpu_cores: 4

# Module definitions  
modules:
  source: "modules/source_module.sh"
  config: "modules/config_module.sh"
  convert: "modules/convert_module.sh" 
  target: "modules/target_module.sh"
  
  # Module metadata
  module_info:
    source:
      description: "Environment & Tools Setup"
      dependencies: ["python3", "git", "cmake", "make"]
      runtime: "host"
      
    config:
      description: "Hardware Detection & CMake Toolchain Generation"
      dependencies: ["crossbuild-essential-arm64"]
      runtime: "container"
      inputs: ["target_hardware_config.txt"]
      outputs: ["cross_compile_toolchain.cmake", "build_config.sh"]
      
    convert:
      description: "Model Format Conversion (HF/ONNX/PyTorch → GGUF)"
      dependencies: ["torch", "transformers", "numpy"]
      runtime: "container"
      inputs: ["model_directory"]
      outputs: ["model.fp16.gguf"]
      
    target:
      description: "Quantization & Cross-Compilation"
      dependencies: ["llama-quantize", "llama-cli"]
      runtime: "container"
      inputs: ["model.fp16.gguf", "cmake_toolchain"]
      outputs: ["deployment_package.zip"]

# Hardware optimization profiles
optimization_profiles:
  rk3566_default:
    cpu_flags: "-mcpu=cortex-a55 -mfpu=neon-fp-armv8"
    cmake_flags: "-DGGML_NATIVE=ON -DGGML_NEON=ON"
    memory_profile: "low_memory"
    recommended_quantization: ["Q4_0", "Q4_K_M", "Q5_0"]
    
  rk3568_default:
    cpu_flags: "-mcpu=cortex-a55 -mfpu=neon-fp-armv8" 
    cmake_flags: "-DGGML_NATIVE=ON -DGGML_NEON=ON"
    memory_profile: "medium_memory"
    recommended_quantization: ["Q4_K_M", "Q5_K_M", "Q8_0"]
    
  rk3576_performance:
    cpu_flags: "-mcpu=cortex-a72 -mfpu=neon-fp-armv8"
    cmake_flags: "-DGGML_NATIVE=ON -DGGML_NEON=ON"
    memory_profile: "high_memory"
    recommended_quantization: ["Q5_K_M", "Q6_K", "Q8_0"]
    
  rk3588_performance:
    cpu_flags: "-mcpu=cortex-a76 -mfpu=neon-fp-armv8"
    cmake_flags: "-DGGML_NATIVE=ON -DGGML_NEON=ON" 
    memory_profile: "high_memory"
    recommended_quantization: ["Q6_K", "Q8_0", "F16"]

# Framework requirements
requirements:
  framework:
    docker_version: ">=20.10"
    docker_compose_version: ">=2.0"
    python_version: ">=3.10"
    poetry_version: ">=1.5"
    
  host_system:
    memory_gb: 8
    disk_gb: 20
    network: "required"
    
  target_system:
    architecture: "aarch64"
    kernel_version: ">=5.10"
    memory_mb: ">=512"
    
# Machine-readable capabilities (schema: orchestrator/schemas/targets.py). GUI, CLI, the build
# service, Ditto and the MCP server offer and validate exactly what is listed here.
# Keep in sync with modules/build.sh (GGUF types) and scripts/export_rkllm.py (RKLLM types);
# tests/test_capabilities.py checks that.
capabilities:
  schema_version: 1
  support_level: official
  boards:
    rk3566:
      label: "RK3566 (4x Cortex-A55)"
      cpu: "4x Cortex-A55"
      ram_max_gb: 8
      npu: "1 TOPS"
      gpu: "Mali-G52"
      examples: ["Radxa ZERO 3W", "Radxa CM3", "ROCK 3C"]
    rk3568:
      label: "RK3568 (4x Cortex-A55)"
      cpu: "4x Cortex-A55"
      ram_max_gb: 8
      npu: "1 TOPS"
      gpu: "Mali-G52"
      examples: ["ROCK 3A", "Radxa E25"]
    rk3576:
      label: "RK3576 (4x A72 + 4x A53)"
      cpu: "4x Cortex-A72 + 4x Cortex-A53"
      ram_max_gb: 16
      npu: "6 TOPS"
      gpu: "Mali-G52"
      examples: ["Radxa ROCK 4D"]
    rk3588:
      label: "RK3588 (4x A76 + 4x A55)"
      cpu: "4x Cortex-A76 + 4x Cortex-A55"
      ram_max_gb: 32
      npu: "6 TOPS"
      gpu: "Mali-G610"
      examples: ["Radxa ROCK 5B", "Radxa ROCK 5ITX", "Orange Pi 5"]
  formats:
    gguf:
      label: "GGUF (llama.cpp, CPU)"
      input: [hf]
      quantizations: [Q4_K_M, Q4_0, IQ4_NL, IQ4_XS, Q5_K_M, Q6_K, Q8_0, Q4_1, Q5_0, Q5_1, Q2_K, Q2_K_S,
                      Q3_K_S, Q3_K_M, Q3_K_L, Q4_K_S, Q5_K_S, IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS, IQ2_S, IQ2_M,
                      IQ3_XXS, IQ3_XS, IQ3_S, IQ3_M, TQ1_0, TQ2_0, MXFP4_MOE, F16, BF16, F32]
      default_quantization: Q4_K_M
      board_default_quantization:
        rk3566: Q4_0
        rk3568: Q4_0
      imatrix: true
      needs_imatrix: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS, IQ2_S]
      dataset: optional
      dataset_kind: text
      notes: "Runs on the CPU of every board. Q4_0 and IQ4_NL are repacked for fast ARM kernels."
    rkllm:
      label: "RKLLM (Rockchip NPU, LLMs)"
      input: [hf]
      quantizations: [w8a8, w8a8_g128, w8a8_g256, w8a8_g512, w4a16, w4a16_g32, w4a16_g64, w4a16_g128]
      default_quantization: w8a8
      boards: [rk3588, rk3576]
      board_quantizations:
        rk3588: [w8a8, w8a8_g128, w8a8_g256, w8a8_g512]
        rk3576: [w4a16, w4a16_g32, w4a16_g64, w4a16_g128, w8a8]
      board_default_quantization:
        rk3588: w8a8
        rk3576: w4a16
      dataset: optional
      dataset_kind: text
      notes: "RKLLM-Toolkit 1.3.1. RK3566/RK3568 are not supported by RKLLM; use GGUF there."
    rknn:
      label: "RKNN (Rockchip NPU, ONNX vision/audio models)"
      input: [onnx]
      quantizations: [fp16, i8]
      default_quantization: fp16
      boards: [rk3566, rk3568, rk3576, rk3588]
      dataset: optional
      dataset_kind: sample_list
      dataset_required_for: [i8]
      notes: "RKNN-Toolkit2 2.3.2. i8 needs a list of sample inputs (paths relative to the list file)."

# Supported model formats
supported_formats:
  input:
    - name: "Hugging Face"
      extensions: [".safetensors", ".bin"] 
      description: "Transformers model with config.json"
      requirements: ["config.json", "tokenizer.json"]
      
    - name: "PyTorch"
      extensions: [".pth", ".pt"]
      description: "PyTorch checkpoint files"
      requirements: ["state_dict"]
      
    - name: "ONNX"
      extensions: [".onnx"]
      description: "ONNX model format"
      requirements: ["onnx runtime"]
      
    - name: "SafeTensors"
      extensions: [".safetensors"]
      description: "Standalone SafeTensors file"
      requirements: ["metadata"]
      
  output:
    - name: "GGUF"
      extensions: [".gguf"]
      description: "llama.cpp quantized format"
      quantization_methods:
        - "Q4_0"    # 4-bit integer (fast, smaller)
        - "Q4_1"    # 4-bit integer (better quality)
        - "Q5_0"    # 5-bit integer (balanced)
        - "Q5_1"    # 5-bit integer (better quality)
        - "Q8_0"    # 8-bit integer (high quality)
        - "Q2_K"    # 2-bit k-quantization
        - "Q3_K_S"  # 3-bit k-quantization (small)
        - "Q3_K_M"  # 3-bit k-quantization (medium)
        - "Q4_K_S"  # 4-bit k-quantization (small)
        - "Q4_K_M"  # 4-bit k-quantization (medium, recommended)
        - "Q5_K_S"  # 5-bit k-quantization (small)
        - "Q5_K_M"  # 5-bit k-quantization (medium)
        - "Q6_K"    # 6-bit k-quantization (high quality)

# Performance benchmarks (reference values)
performance_benchmarks:
  granite_350m:
    rk3566:
      q4_k_m:
        memory_usage_mb: 180
        first_token_ms: 800
        tokens_per_second: 12
        cpu_usage_percent: 85
        
    rk3588:
      q4_k_m:
        memory_usage_mb: 180 
        first_token_ms: 450
        tokens_per_second: 25
        cpu_usage_percent: 60
        
  llama2_7b:
    rk3588:
      q4_k_m:
        memory_usage_mb: 4200
        first_token_ms: 2000
        tokens_per_second: 8
        cpu_usage_percent: 95

# Validation and testing
validation:
  unit_tests:
    - "test_docker_build"
    - "test_module_execution" 
    - "test_cross_compilation"
    - "test_quantization"
    
  integration_tests:
    - "test_full_pipeline"
    - "test_model_accuracy"
    - "test_performance_regression"
    
  compatibility_tests:
    - "test_rk3566_deployment"
    - "test_rk3588_deployment"
    - "test_different_models"

# Community and contribution
community:
  contribution_guide: "docs/contributing.md"
  issue_template: ".github/ISSUE_TEMPLATE.md"
  pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
  
  maintainers:
    - name: "Framework Core Team"
      github: "@llm-framework"
      role: "primary"
      
  contributors:
    - name: "Community Contributors"
      github: "@community"
      role: "development"

# Changelog and versioning
changelog:
  v1.0.0:
    date: "2024-11-03"
    changes:
      - "Initial release"
      - "Complete RK3566/RK3588 support"
      - "4-module architecture"
      - "Professional GUI with wizard"
      - "Docker-based cross-compilation"
      - "Hardware optimization profiles"
    breaking_changes: []
    
  planned:
    v1.1.0:
      - "RK3576 optimization profiles"
      - "NPU utilization support"
      - "Performance auto-tuning"
      - "Extended model format support"