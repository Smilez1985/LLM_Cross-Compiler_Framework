---
# LLM Cross-Compiler Framework - Target Template
# Füllen Sie diese Datei aus, um ein neues Hardware-Ziel zu definieren.

metadata:
  name: "[Hardware-Familie]"
  description: "Beschreibung der Hardware-Familie (z.B. Raspberry Pi Familie)"
  maintainer: "[Ihr Name oder Organisation]"
  version: "1.0.0"
  created: "YYYY-MM-DD"
  
  # Klassifizierung
  category: "embedded_soc" # z.B. embedded_soc, desktop_gpu, npu
  architecture_family: "[aarch64, x86_64, etc.]"
  vendor: "[Hersteller]"

# Unterstützte Hardware
supported_boards:
  - name: "[Board Name 1]"
    description: "[CPU, GPU, NPU Spezifikationen]"
    specifications:
      cpu_cores: 4
      cpu_arch: "cortex-a72"
      npu: "Keine"
      memory_max: "8GB"
      
  - name: "[Board Name 2]"
    description: "[Spezifikationen]"

# Docker-Konfiguration
docker:
  # Ein lokaler Image-Name: Das Image wird auf diesem Rechner gebaut, nie hoch- oder heruntergeladen.
  image_name: "llm-framework/[ihr-target-name]"
  # Keine Registry: Das Framework veröffentlicht keine Images. Nichts liest dieses Feld.
  registry: ""
  build_context: "."
  dockerfile: "Dockerfile"
  
  # Build-Argumente
  build_args:
    LLAMA_CPP_TAG: "b11429"   # the llama.cpp pin of configs/llama_runtime.yml (llama_cpp.source.tag)
    LLAMA_CPP_COMMIT: "d81235049384534c167caea52b85a694f6103d14"   # llama_cpp.source.commit, fetched and checked
    BUILD_JOBS: "4"
    PYTHON_VERSION: "3.11"

# Modul-Definitionen: the build (DECISIONS U9). modules/build.sh, the stage runner, runs the four stage modules in
# this order inside the image; each module's header says what its stage does. This block describes the folder;
# nothing reads it.
modules:
  runner: "modules/build.sh"
  source: "modules/source_module.sh"
  config: "modules/config_module.sh"
  convert: "modules/convert_module.sh"
  target: "modules/target_module.sh"
  # Optional hook between convert and target (roadmap: rotation): runs only when the target has this file.
  rotate: "modules/rotate_module.sh"

  module_info:
    source:
      description: "Toolchain sources of the image and the SDK setup commands (their exports reach the later stages)"
      outputs: ["sdk_environment.sh"]
    config:
      description: "Request checks and the build plan; with a hardware profile also the CMake toolchain"
      inputs: ["the request (environment)", "target_hardware_config.txt (optional)"]
      outputs: ["build_config.sh", "cross_compile_toolchain.cmake (hardware profile only)"]
    convert:
      description: "Model conversion: the quantization logic of the module, by default HF -> GGUF; the imatrix job"
      inputs: ["model_directory", "build_config.sh"]
      outputs: ["<model>-<type>.gguf", "tmp-<model>-F16.gguf and quantize_jobs.sh", "imatrix.dat"]
    target:
      description: "Quantization, the packaging commands of the module and build_info.json"
      inputs: ["quantize_jobs.sh", "build_config.sh"]
      outputs: ["<model>-<type>.gguf", "build_info.json", "packages/ (hardware profile only)"]

# Hardware optimization profiles: descriptive, nothing reads them. The board's runtime takes llama.cpp's options from
# the build recipe (orchestrator/runtime/build/recipe.py).
optimization_profiles:
  default:
    cpu_flags: "-mcpu=native -march=native"
    cmake_flags: "-DGGML_NATIVE=ON"
    memory_profile: "medium_memory"
    recommended_quantization: ["Q4_K_M", "Q8_0"]
    
  performance:
    cpu_flags: "-mcpu=cortex-a76 -mfpu=neon-fp-armv8"
    cmake_flags: "-DGGML_NATIVE=ON -DGGML_NEON=ON" 
    memory_profile: "high_memory"
    recommended_quantization: ["Q6_K", "Q8_0"]

# Anforderungen
requirements:
  framework:
    docker_version: ">=20.10"
    python_version: ">=3.10"
    
  host_system:
    memory_gb: 8
    disk_gb: 20