---
# LLM Cross-Compiler Framework - Target Template
# Füllen Sie diese Datei aus, um ein neues Hardware-Ziel zu definieren.

metadata:
  name: "[Hardware-Familie]"
  description: "Beschreibung der Hardware-Familie (z.B. Raspberry Pi Familie)"
  maintainer: "[Ihr Name oder Organisation]"
  version: "1.0.0"
  created: "YYYY-MM-DD"
  
  # Klassifizierung
  category: "embedded_soc" # z.B. embedded_soc, desktop_gpu, npu
  architecture_family: "[aarch64, x86_64, etc.]"
  vendor: "[Hersteller]"

# Unterstützte Hardware
supported_boards:
  - name: "[Board Name 1]"
    description: "[CPU, GPU, NPU Spezifikationen]"
    specifications:
      cpu_cores: 4
      cpu_arch: "cortex-a72"
      npu: "Keine"
      memory_max: "8GB"
      
  - name: "[Board Name 2]"
    description: "[Spezifikationen]"

# Docker-Konfiguration
docker:
  # Ein lokaler Image-Name: Das Image wird auf diesem Rechner gebaut, nie hoch- oder heruntergeladen.
  image_name: "llm-framework/[ihr-target-name]"
  # Keine Registry: Das Framework veröffentlicht keine Images. Nichts liest dieses Feld.
  registry: ""
  build_context: "."
  dockerfile: "Dockerfile"
  
  # Build-Argumente
  build_args:
    LLAMA_CPP_TAG: "b11429"   # the llama.cpp pin of configs/llama_runtime.yml (llama_cpp.source.tag)
    LLAMA_CPP_COMMIT: "d81235049384534c167caea52b85a694f6103d14"   # llama_cpp.source.commit, fetched and checked
    BUILD_JOBS: "4"
    PYTHON_VERSION: "3.11"

# Modul-Definitionen: the build (DECISIONS U9). modules/build.sh, the stage runner, runs the four stage modules in
# this order inside the image; each module's header says what its stage does. This block describes the folder;
# nothing reads it.
modules:
  runner: "modules/build.sh"
  source: "modules/source_module.sh"
  config: "modules/config_module.sh"
  convert: "modules/convert_module.sh"
  target: "modules/target_module.sh"
  # Optional hook between convert and target (roadmap: rotation): runs only when the target has this file.
  rotate: "modules/rotate_module.sh"

  module_info:
    source:
      description: "Toolchain sources of the image and the SDK setup commands (their exports reach the later stages)"
      outputs: ["sdk_environment.sh"]
    config:
      description: "Request checks and the build plan; with a hardware profile also the CMake toolchain, checked
        (compiler test with CC and CXX of the image, CMake reads the toolchain file, the plan is a valid shell script)"
      inputs: ["the request (environment)", "target_hardware_config.txt (optional)"]
      outputs: ["build_config.sh", "cross_compile_toolchain.cmake (hardware profile only)"]
    convert:
      description: "Model conversion: the quantization logic of the module, by default HF -> GGUF; the imatrix job.
        Around it (scripts/model_check.py): format detection, integrity checks of the input and the output, the
        statistics, a functional test of the GGUF, cleanup on failure"
      inputs: ["model_directory (or a GGUF file: nothing converted)", "build_config.sh"]
      outputs: ["<model>-<type>.gguf", "tmp-<model>-F16.gguf (or the --output file) and quantize_jobs.sh",
                "imatrix.dat", "convert_stats.json (\"conversion\" in build_info.json)"]
    target:
      description: "Quantization, the packaging commands of the module and build_info.json; with a hardware profile
        or on request (--package, target_module.sh by hand) the package for the board: llama-cli, llama-server, model
        card, test_model.sh, deploy.sh, MANIFEST.json and SHA256SUMS, checked before it is kept"
      inputs: ["quantize_jobs.sh", "build_config.sh"]
      outputs: ["<model>-<type>.gguf", "build_info.json", "packages/ (hardware profile or --package)"]

# Hardware optimization profiles, one per board of the capabilities block (schema: orchestrator/schemas/targets.py
# OptimizationProfile; read by orchestrator/Core/board_profiles.py; docs/Module_Developer_Guide.md, "target.yml").
# The module generator writes one per board from the build recipe's plan (orchestrator/runtime/build/recipe.py) for
# the board's probe, or for the plain defaults of the architecture without one. The source side (cmake_options,
# cpu_flags) must be what the recipe plans for the SoC (`llm-cli targets validate` checks it); the target side
# (recommended_quantization, memory_profile, optimization) is what the Builder, the CLI and AI callers offer first.
# Example:
#   my_board:
#     arch: arm64
#     cpu: cortex-a55
#     cpu_features: [neon, dotprod, fp16]
#     cmake_options: {GGML_NATIVE: "OFF", GGML_CPU_ARM_ARCH: "armv8.2-a+dotprod+fp16"}
#     cpu_flags: "-march=armv8.2-a+dotprod+fp16"
#     memory_profile: low_memory
#     optimization: size
#     recommended_quantization: [Q4_0, Q4_K_M]
optimization_profiles: {}

# Benchmark rows (schema: BenchmarkEntry): model, board, quantization, the values (gen_ts and prompt_ts are what a
# board test measures) and their source: measured (board label and date), published (https address and date) or
# unmeasured (shown as such).
performance_benchmarks: []

# Anforderungen
requirements:
  framework:
    docker_version: ">=20.10"
    python_version: ">=3.10"
    
  host_system:
    memory_gb: 8
    disk_gb: 20