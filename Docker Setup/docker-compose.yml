# The LLM Cross-Compiler Framework in a container (Docker Compose v2: docker compose -f "Docker Setup/docker-compose.yml").
#
# The image is built on this computer with scripts/build_container_image.sh (make build); no framework image is
# published, and compose never pulls one (pull_policy: never). Guide: docs/Container_Setup.md.
#
#   make up      starts the headless framework as the container lcf-framework (kept running for docker exec)
#   make gui     starts the GUI (explicit option: image built with make build-gui, your X11 display passed in)
#   make down    stops both; the data volume stays
#
# Everything personal (settings, credential vault, audit log, MCP tokens, models, builds) lives in the volume
# lcf-data, mounted at /data. No port is published: AI clients reach the MCP server over stdio
# (docker exec -i lcf-framework llm-cli mcp serve), from another computer over SSH to this one.

name: lcf

services:
  framework:
    image: ${LCF_IMAGE:-lcf-framework:local}
    pull_policy: never
    container_name: lcf-framework
    command: ["sleep", "infinity"]
    volumes:
      - lcf-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gui:
    profiles: ["gui"]
    image: ${LCF_GUI_IMAGE:-lcf-framework:local-gui}
    pull_policy: never
    container_name: lcf-framework-gui
    command: ["llm-framework"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - lcf-data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  lcf-data:
    name: lcf-data   # the same volume as in the builder's docker run examples
