version: 2
updates:
  # pyproject.toml and uv.lock. Dependabot changes the lock only: export requirements.txt and requirements-dev.txt
  # again on its branch (CONTRIBUTING.md, section 2); the CI job "Lock files" fails until they match uv.lock.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/targets/Rockchip"
      - "/targets/_template"
      - "/Docker Setup"   # the base image of the framework container you build locally
    schedule:
      interval: weekly
