version: 2
updates:
  # pyproject.toml and uv.lock. Dependabot changes the lock only: export requirements.txt, requirements-gui.txt,
  # requirements-dev.txt and requirements-resolve.txt again on its branch (CONTRIBUTING.md, section 2); the CI job
  # "Lock files" fails until they match uv.lock. A 0.x package's range ends before its next minor (uv: >=0.13.7,<0.14),
  # so a bump past it needs both bounds raised by hand.
  - package-ecosystem: uv
    directory: "/"
    # The hash-pinned exports are made by `uv export` from uv.lock, not edited by Dependabot (its pip-compile updater
    # fails on them: "unknown url type: '/pypi/<package>/json'").
    exclude-paths:
      - "requirements.txt"
      - "requirements-gui.txt"
      - "requirements-dev.txt"
      - "requirements-resolve.txt"
    # Pull requests go to development, where the work lands; main only receives development as a whole.
    target-branch: development
    schedule:
      interval: weekly
    # The same 5-day cooldown as pyproject.toml [tool.uv] exclude-newer (DESIGN round 65): a newer version would
    # not resolve there. The scheduled update run (.github/workflows/deps-update.yml) takes the whole lock forward.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    # Pull requests go to development, where the work lands; main only receives development as a whole.
    target-branch: development
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/targets/Rockchip"
      - "/targets/_template"
      - "/Docker Setup"   # the base image of the framework container you build locally
    # Pull requests go to development, where the work lands; main only receives development as a whole.
    target-branch: development
    schedule:
      interval: weekly
    # Every Ubuntu release may be proposed, LTS or not (DESIGN round 67): a bump that breaks the GPU template's
    # pairing with CUDA (configs/llama_runtime.yml, build_bases) turns CI red and is fixed on its branch first.
