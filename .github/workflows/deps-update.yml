name: Dependency update

# DECISIONS round 65: the newest compatible versions, inside the ranges of pyproject.toml and after the 5-day cooldown
# ([tool.uv] exclude-newer), go through the same gates as every change: `uv lock --upgrade`, the exports with hashes,
# the whole test matrix of ci.yml and pip-audit as security.yml runs it. Only when every job is green is the branch
# deps/update pushed and a pull request to development opened (or the open one updated). Nothing is merged
# automatically; main only receives development as a whole.
# Weekly, on Tuesday night: after Monday's security run and Dependabot's weekly pass, so this run takes the whole lock
# forward once a week (the installers resolve fresh on every run anyway, scripts/fresh_deps.py); a manual run any time.
on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  lock:
    name: uv lock --upgrade (5-day cooldown) and the exports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install uv and pip-audit (hash-pinned, from the tested lock)
        run: python -m pip install --require-hashes --no-deps -r requirements-resolve.txt

      - name: Drop the cooldown exceptions the cooldown has passed
        run: python scripts/fresh_deps.py prune-exceptions --project .

      - name: The newest compatible versions (uv computes now minus 5 days in UTC from pyproject.toml)
        run: uv lock --upgrade

      - name: The hash-pinned exports, made as ci.yml checks them
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project -o requirements.txt
          uv export --frozen --format requirements-txt --no-dev --extra gui --no-emit-project -o requirements-gui.txt
          uv export --frozen --format requirements-txt --only-group dev --no-emit-project -o requirements-dev.txt
          uv export --frozen --format requirements-txt --only-group resolve --no-emit-project -o requirements-resolve.txt

      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- pyproject.toml uv.lock requirements.txt requirements-gui.txt requirements-dev.txt \
              requirements-resolve.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing newer inside the ranges after the cooldown."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Keep the update for the checks
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-update
          path: |
            pyproject.toml
            uv.lock
            requirements.txt
            requirements-gui.txt
            requirements-dev.txt
            requirements-resolve.txt
          if-no-files-found: error

  audit:
    name: pip-audit (the updated exports)
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pip-audit (hash-pinned, from the tested lock)
        run: python -m pip install --require-hashes --no-deps -r requirements-resolve.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-update

      - name: Audit the runtime pins (every platform, as security.yml) and the tools
        run: |
          python scripts/fresh_deps.py audit --requirements requirements-gui.txt --pip-audit "$(command -v pip-audit)"
          pip-audit --requirement requirements-dev.txt --desc on
          pip-audit --requirement requirements-resolve.txt --desc on

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-update

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install the updated dependencies (with the GUI extra, as the desktop installers do)
        run: python -m pip install --no-deps -r requirements-gui.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -ra

  propose:
    name: Push deps/update and open a pull request to development
    needs: [lock, audit, test]
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-update

      - name: Commit and push deps/update, open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c deps/update
          git add pyproject.toml uv.lock requirements.txt requirements-gui.txt requirements-dev.txt \
            requirements-resolve.txt
          git commit -m "Dependencies: the newest compatible versions (5-day cooldown, tests and pip-audit green)"
          # The token only for this push, never stored in the checkout (persist-credentials: false).
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin HEAD:refs/heads/deps/update
          if [ -z "$(gh pr list --head deps/update --base development --state open --json number --jq '.[].number')" ]; then
            gh pr create --base development --head deps/update \
              --title "Dependencies: the newest compatible versions" \
              --body "The scheduled update run (.github/workflows/deps-update.yml): \`uv lock --upgrade\` inside the ranges of pyproject.toml with the 5-day cooldown, the exports again; the whole test matrix and pip-audit passed in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Review and merge by hand; nothing is merged automatically."
          fi
