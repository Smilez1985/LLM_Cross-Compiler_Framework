name: Docker

on:
  pull_request:
    paths:
      - "targets/**"
      - "entrypoint.sh"
      - "orchestrator/utils/build_context.py"
      - "orchestrator/Core/builder.py"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "targets/**"
      - "entrypoint.sh"
      - "orchestrator/utils/build_context.py"
      - "orchestrator/Core/builder.py"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - targets/Rockchip/dockerfile
          - targets/_template/Dockerfile
          - targets/_template/Dockerfile.gpu
          - orchestrator/runtime/build/builder.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  build-rockchip:
    name: Build and smoke-test Rockchip image
    needs: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage build context (same code path as BuildEngine)
        run: python3 -m orchestrator.utils.build_context targets/Rockchip "$RUNNER_TEMP/rockchip-context"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/rockchip-context
          file: ${{ runner.temp }}/rockchip-context/Dockerfile
          tags: llm-framework/rockchip:ci
          load: true
          push: false
          cache-from: type=gha,scope=rockchip
          cache-to: type=gha,mode=max,scope=rockchip

      - name: Smoke test (toolchain, Python packages, entrypoint)
        run: |
          docker run --rm --pull never llm-framework/rockchip:ci test
          docker run --rm --pull never llm-framework/rockchip:ci status
          # Each SDK lives in its own venv (their torch pins conflict); import it with that interpreter.
          docker run --rm --pull never --entrypoint python3 llm-framework/rockchip:ci \
            -c "import torch, transformers, gguf; print('gguf venv ok')"
          docker run --rm --pull never --entrypoint /opt/venv-rkllm/bin/python llm-framework/rockchip:ci \
            -c "from rkllm.api import RKLLM; print('rkllm venv ok')"
          docker run --rm --pull never --entrypoint /opt/venv-rknn/bin/python llm-framework/rockchip:ci \
            -c "from rknn.api import RKNN; print('rknn venv ok')"

      - name: Smoke test (llama.cpp conversion tools from the pinned commit)
        run: |
          commit="$(docker run --rm --pull never --entrypoint cat llm-framework/rockchip:ci /usr/src/llama.cpp/.llama_cpp_commit)"
          grep -q "commit: ${commit}" configs/llama_runtime.yml
          docker run --rm --pull never --entrypoint /usr/src/llama.cpp/build/bin/llama-bench llm-framework/rockchip:ci --version \
            2>&1 | grep -F "commit ${commit:0:8})"

      - name: Smoke test (container setup as used by BuildEngine)
        # BuildEngine starts containers as root with read-only files under /build-cache; the
        # entrypoint must fix permissions, drop to llmbuilder and keep the venv on PATH.
        run: |
          echo "calibration text" > "$RUNNER_TEMP/dataset.txt"
          docker run --rm --pull never --user 0:0 -v "$RUNNER_TEMP/dataset.txt:/build-cache/dataset.txt:ro" \
            llm-framework/rockchip:ci python3 -c \
            "import getpass, sys; assert getpass.getuser() == 'llmbuilder', getpass.getuser(); assert sys.prefix == '/opt/venv', sys.prefix; print('entrypoint ok')"
          docker run --rm --pull never --entrypoint test llm-framework/rockchip:ci -x /app/modules/build.sh

      - name: Smoke test (sandboxed conversion container)
        # BuildEngine runs conversion stages as the host user without network, capabilities or a
        # writable image filesystem; only the work folder is writable.
        run: |
          mkdir -p "$RUNNER_TEMP/work/tmp" "$RUNNER_TEMP/work/home"
          docker run --rm --pull never --user "$(id -u):$(id -g)" --network none --cap-drop ALL \
            --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            -v "$RUNNER_TEMP/work:/build-cache/work" -w /build-cache/work \
            -e HOME=/build-cache/work/home -e TMPDIR=/build-cache/work/tmp -e BUILD_SCRATCH_DIR=/build-cache/work \
            llm-framework/rockchip:ci python3 -c \
            "import gguf, torch, tempfile; tempfile.NamedTemporaryFile(); print('sandbox ok')"
