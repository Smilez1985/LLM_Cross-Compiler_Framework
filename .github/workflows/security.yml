name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bandit
        run: python -m pip install -r requirements-dev.txt

      - name: Bandit (fails on high severity, high confidence)
        run: bandit -r orchestrator scripts targets --severity-level high --confidence-level high

      - name: Bandit full report (medium and up, informational)
        if: always()
        run: bandit -r orchestrator scripts targets --severity-level medium --exit-zero

  pip-audit:
    name: pip-audit (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      - name: Audit pinned runtime dependencies
        # requirements.txt is a fully pinned export, so the pins are audited as they are.
        run: pip-audit --requirement requirements.txt --no-deps --disable-pip --desc on

      - name: Audit dev tools
        run: pip-audit --requirement requirements-dev.txt --desc on
