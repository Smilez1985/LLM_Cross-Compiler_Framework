name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bandit
        run: python -m pip install -r requirements-dev.txt

      - name: Bandit (fails on high severity, high confidence)
        run: bandit -r orchestrator scripts targets --severity-level high --confidence-level high

      - name: Bandit full report (medium and up, informational)
        if: always()
        run: bandit -r orchestrator scripts targets --severity-level medium --exit-zero

  pip-audit:
    name: pip-audit (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      - name: Audit pinned runtime dependencies
        # requirements.txt is a fully pinned export. Markers are stripped so Windows-only and
        # version-specific pins are audited too, not only those matching this Linux runner.
        # A package pinned differently per Python version (e.g. numpy) goes to a second file,
        # because pip-audit rejects duplicate names in one requirements file.
        run: |
          grep -E '^[A-Za-z0-9]' requirements.txt \
            | sed -E 's/[[:space:]]*;.*$//; s/[[:space:]]*\\$//' \
            | awk -F'==' -v main="$RUNNER_TEMP/req-main.txt" -v dups="$RUNNER_TEMP/req-dups.txt" \
                '{ if (seen[$1]++) print > dups; else print > main }'
          pip-audit --requirement "$RUNNER_TEMP/req-main.txt" --no-deps --disable-pip --desc on
          if [ -s "$RUNNER_TEMP/req-dups.txt" ]; then
            pip-audit --requirement "$RUNNER_TEMP/req-dups.txt" --no-deps --disable-pip --desc on
          fi

      - name: Audit dev tools
        run: pip-audit --requirement requirements-dev.txt --desc on
