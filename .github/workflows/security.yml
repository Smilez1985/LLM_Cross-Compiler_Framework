name: Security

on:
  push:
    branches: [main, develop, development]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Scan every commit for API keys, tokens and private keys
        run: python scripts/secret_scan.py --history

      # The allowlist (.secret-scan-allow) applies to --history only; the tracked files of this commit get the
      # full check, so a listed test mock added again fails here and not only in the optional git hooks.
      - name: Scan the tracked files of this commit
        run: python scripts/secret_scan.py

  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install bandit
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Bandit (fails on high severity, high confidence)
        run: bandit -r orchestrator scripts targets --severity-level high --confidence-level high

      - name: Bandit full report (medium and up, informational)
        if: always()
        run: bandit -r orchestrator scripts targets --severity-level medium --exit-zero

  pip-audit:
    name: pip-audit (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install pip-audit
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Audit pinned runtime dependencies
        # requirements-gui.txt is a fully pinned export (requirements.txt plus the optional extra 'gui', so every
        # runtime pin is audited, PySide6 too). Markers are stripped so Windows-only and
        # version-specific pins are audited too, not only those matching this Linux runner.
        # A package pinned differently per Python version (e.g. numpy) goes to a second file,
        # because pip-audit rejects duplicate names in one requirements file.
        # One finding is ignored, for a reason: CVE-2026-126190 in Soup Sieve before 4.0 (polynomial time of the
        # descendant combinator on deeply nested pages). Soup Sieve 4.0 needs Python 3.11.5, so the pin for older 3.11
        # (Debian 12 brings 3.11.2) stays 2.10; llmcf itself never runs a CSS selector, it looks elements up with
        # Beautiful Soup's find(), and tests/test_no_css_selectors.py keeps it so (docs/DESIGN.md, Supply chain).
        run: |
          grep -E '^[A-Za-z0-9]' requirements-gui.txt \
            | sed -E 's/[[:space:]]*;.*$//; s/[[:space:]]*\\$//' \
            | awk -F'==' -v main="$RUNNER_TEMP/req-main.txt" -v dups="$RUNNER_TEMP/req-dups.txt" \
                '{ if (seen[$1]++) print > dups; else print > main }'
          pip-audit --requirement "$RUNNER_TEMP/req-main.txt" --no-deps --disable-pip --desc on --ignore-vuln CVE-2026-126190
          if [ -s "$RUNNER_TEMP/req-dups.txt" ]; then
            pip-audit --requirement "$RUNNER_TEMP/req-dups.txt" --no-deps --disable-pip --desc on --ignore-vuln CVE-2026-126190
          fi

      - name: Audit dev tools
        run: pip-audit --requirement requirements-dev.txt --desc on
