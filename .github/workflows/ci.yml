name: CI

on:
  push:
    branches: [main, develop, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install lint tools
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Ruff (syntax errors and undefined names)
        run: ruff check --no-cache --select E9,F63,F7,F82 --output-format github orchestrator scripts tests targets

      - name: ShellCheck (errors)
        # targets/_template holds placeholders that module_generator fills in, so it is not valid shell yet.
        run: git ls-files -z '*.sh' ':!:targets/_template/*' | xargs -0 shellcheck --severity=error

      - name: actionlint
        # The workflows of this repository, and the community repository's check template (not run here).
        run: |
          actionlint
          actionlint scripts/community_repo/validate-contribution.yml

  lock:
    name: Lock files (uv.lock and the requirements exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: false

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      # The installers and the test jobs install from the exports, so they must be exactly what uv.lock pins.
      # requirements-gui.txt is the base plus the optional extra 'gui' (PySide6), which the desktop installers install.
      - name: requirements.txt, requirements-gui.txt and requirements-dev.txt are the exports of uv.lock
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project -o requirements.txt
          uv export --frozen --format requirements-txt --no-dev --extra gui --no-emit-project -o requirements-gui.txt
          uv export --frozen --format requirements-txt --only-group dev --no-emit-project -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-gui.txt requirements-dev.txt

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows needs about 45 minutes for the whole suite, Linux with the GUI extra about 30 (headless about 15).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies (with the GUI extra, as the desktop installers do)
        # --no-deps: the exports are complete (every package, every hash), so pip installs exactly that set and does
        # not resolve again (pyproject.toml [tool.uv] overrides one upstream cap: Pillow).
        run: python -m pip install --no-deps -r requirements-gui.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -ra --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  runtime-layer-tools:
    # The runtime layer's two static tools made the way "build" (scripts/runtime_toolbox.py: the framework's builder
    # image over the pinned util-linux and busybox tarballs, each checked by its sha256), then the runtime layer's
    # tests on the real kernel with these real tools (as root: they hand the runner exactly CAP_SETUID and
    # CAP_SETGID). The tools and their SHA256SUMS are uploaded as a workflow artifact for inspection only: util-linux
    # setpriv is C and never a release asset; the framework's own Rust llmcf-setpriv is (release-tools.yml).
    name: Runtime layer tools (Linux, real static busybox and setpriv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install dependencies (base only)
        run: python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Build the static busybox and setpriv the way "build"
        run: python scripts/runtime_toolbox.py "$RUNNER_TEMP/runtime-toolbox"

      - name: Runtime layer tests with the real tools (as root)
        # Some tests start Python as an unprivileged test account (uid 64020, no groups) that imports the framework
        # from this checkout; the runner's home is 0750, so the way to the checkout is opened for other users (pass
        # through for the folders above it, read for the checkout). A computer with a private home skips those
        # tests with a plain reason instead.
        run: |
          dir="$GITHUB_WORKSPACE"
          while [ "$dir" != "/" ]; do dir="$(dirname "$dir")"; sudo chmod o+x "$dir"; done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo -E env "PATH=$PATH" "LLMCF_TEST_TOOLBOX=$RUNNER_TEMP/runtime-toolbox" \
            "$(command -v python)" -m pytest -ra tests/test_runtime_layer.py tests/test_stage_user.py

      - name: Build llmcf-setpriv (static musl, the toolchain of rust/rust-toolchain.toml)
        # The framework's own Rust uid switch (rust/llmcf-setpriv): linked with rust-lld and the toolchain's own
        # musl, no C cross toolchain; refused when it is not static
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --release --locked -p llmcf-setpriv --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/llmcf-setpriv
          if readelf -lW "$bin" | grep -q 'program interpreter'; then echo "llmcf-setpriv is not static" >&2; exit 1; fi
          cp "$bin" "$RUNNER_TEMP/llmcf-setpriv-amd64"

      - name: llmcf-setpriv's switch on the real kernel (its own tests, as root)
        # Drops to an unprivileged account and checks the ids, the groups, the capability sets and that becoming
        # root again fails; the test binaries run through sudo
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test --locked -p llmcf-setpriv

      - name: Runtime layer tests with llmcf-setpriv as the layer's uid switch (as root)
        # The same real-kernel tests as above, with the static llmcf-setpriv in the layer's bin/setpriv: the runner's
        # switch of the entrypoint and every stage switch of stage_user.sh go through it
        run: |
          sudo -E env "PATH=$PATH" "LLMCF_TEST_TOOLBOX=$RUNNER_TEMP/runtime-toolbox" \
            "LLMCF_TEST_LAYER_SETPRIV=$RUNNER_TEMP/llmcf-setpriv-amd64" \
            "$(command -v python)" -m pytest -ra tests/test_runtime_layer.py tests/test_stage_user.py

      - name: Upload the tools and their SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-layer-tools-linux-amd64
          path: ${{ runner.temp }}/runtime-toolbox
          if-no-files-found: error

  rust:
    # The Rust workspace (rust/): llmcf-install, the board bundle's root helper, and llmcf-setpriv. The toolchain is
    # the one rust/rust-toolchain.toml pins (rustup on the runner installs it with its three musl targets); the
    # release programs are static musl binaries linked with the toolchain's own rust-lld (rust/.cargo/config.toml).
    # The release build of llmcf-install must refuse the test mode (--root, only under the cargo feature test-root),
    # and the framework's tests of llmcf-install run against the test build on a fake board.
    name: Rust (fmt, clippy, tests, static musl builds, cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: "1"
      # a runner has no keyring: the framework's tests below keep the vault in memory
      LLM_SECRET_STORAGE: ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p llmcf-install --all-targets --features test-root -- -D warnings

      - name: cargo test (the test build of llmcf-install against a fake root prefix)
        run: cargo test --locked --workspace --features llmcf-install/test-root

      - name: Static musl release builds (x86_64, aarch64, armv7)
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cargo build --locked --release -p llmcf-install --target "$target"
          done

      - name: Every release program is static
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            program="target/$target/release/llmcf-install"
            file "$program"
            if readelf -lW "$program" | grep -q INTERP; then echo "$program has a program interpreter" >&2; exit 1; fi
            if readelf -dW "$program" | grep -q NEEDED; then echo "$program needs shared libraries" >&2; exit 1; fi
          done

      - name: The release program refuses the test mode
        run: |
          set +e
          out="$(./target/x86_64-unknown-linux-musl/release/llmcf-install --root /tmp plan llm-test 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && echo "$out" | grep -q "no test mode"

      - name: cargo-deny (pinned version)
        run: |
          cargo install --locked cargo-deny --version =0.19.9
          cargo deny --manifest-path Cargo.toml check

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: The framework's tests of llmcf-install with the test build
        working-directory: .
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          cargo build --locked --manifest-path rust/Cargo.toml -p llmcf-install --features test-root
          LLMCF_INSTALL_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-install" \
            python -m pytest -ra tests/test_llmcf_install.py tests/test_board_bundle.py

  test-headless:
    # The install without the optional extra 'gui' (DECISIONS round 11, A3): a headless or server install and the
    # framework image without --gui. No PySide6 and no Qt libraries: the Qt-free checks (tests/test_qt_free_core.py:
    # the core's texts, `llmcf --help`, `llmcf mcp serve` and the plain message of llm-gui) and the non-GUI suite run;
    # the GUI's tests skip themselves.
    name: Tests without the GUI extra (Linux, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install dependencies (base only, no GUI extra)
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          if python -c "import PySide6" 2>/dev/null; then echo "PySide6 is installed; this job must run without it" >&2; exit 1; fi

      - name: Qt-free checks
        run: python -m pytest -ra tests/test_qt_free_core.py tests/test_lazy_loading.py

      - name: Run the non-GUI suite
        run: python -m pytest -ra --junitxml=test-results-headless.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-headless
          path: test-results-headless.xml
          if-no-files-found: ignore
