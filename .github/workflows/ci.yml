name: CI

on:
  push:
    branches: [main, develop, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint tools
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Ruff (syntax errors and undefined names)
        run: ruff check --no-cache --select E9,F63,F7,F82 --output-format github orchestrator scripts tests targets

      - name: ShellCheck (errors)
        # targets/_template holds placeholders that module_generator fills in, so it is not valid shell yet.
        run: git ls-files -z '*.sh' ':!:targets/_template/*' | xargs -0 shellcheck --severity=error

      - name: actionlint
        # The workflows of this repository, and the community repository's check template (not run here).
        run: |
          actionlint
          actionlint scripts/community_repo/validate-contribution.yml

  lock:
    name: Lock files (uv.lock and the requirements exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      # The installers and the test jobs install from the exports, so they must be exactly what uv.lock pins.
      # requirements-gui.txt is the base plus the optional extra 'gui' (PySide6), which the desktop installers install.
      - name: requirements.txt, requirements-gui.txt and requirements-dev.txt are the exports of uv.lock
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project -o requirements.txt
          uv export --frozen --format requirements-txt --no-dev --extra gui --no-emit-project -o requirements-gui.txt
          uv export --frozen --format requirements-txt --only-group dev --no-emit-project -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-gui.txt requirements-dev.txt

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The Windows runner needs about an hour for the whole suite (Linux about 12 minutes).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-gui.txt
            requirements-dev.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies (with the GUI extra, as the desktop installers do)
        # --no-deps: the exports are complete (every package, every hash), so pip installs exactly that set and does
        # not resolve again (pyproject.toml [tool.uv] overrides one upstream cap: Pillow).
        run: python -m pip install --no-deps -r requirements-gui.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -ra --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  test-headless:
    # The install without the optional extra 'gui' (DECISIONS round 11, A3): a headless or server install and the
    # framework image without --gui. No PySide6 and no Qt libraries: the Qt-free checks (tests/test_qt_free_core.py:
    # the core's texts, `llmcf --help`, `llmcf mcp serve` and the plain message of llm-gui) and the non-GUI suite run;
    # the GUI's tests skip themselves.
    name: Tests without the GUI extra (Linux, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (base only, no GUI extra)
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          if python -c "import PySide6" 2>/dev/null; then echo "PySide6 is installed; this job must run without it" >&2; exit 1; fi

      - name: Qt-free checks
        run: python -m pytest -ra tests/test_qt_free_core.py tests/test_lazy_loading.py

      - name: Run the non-GUI suite
        run: python -m pytest -ra --junitxml=test-results-headless.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-headless
          path: test-results-headless.xml
          if-no-files-found: ignore
