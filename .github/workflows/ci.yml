name: CI

on:
  push:
    branches: [main, develop, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install lint tools
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Ruff (syntax errors and undefined names)
        run: ruff check --no-cache --select E9,F63,F7,F82 --output-format github orchestrator scripts tests targets

      - name: ShellCheck (errors)
        # targets/_template holds placeholders that module_generator fills in, so it is not valid shell yet.
        run: git ls-files -z '*.sh' ':!:targets/_template/*' | xargs -0 shellcheck --severity=error

      - name: actionlint
        # The workflows of this repository, and the community repository's check template (not run here).
        run: |
          actionlint
          actionlint scripts/community_repo/validate-contribution.yml

  lock:
    name: Lock files (uv.lock and the requirements exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: false

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      # The installers and the test jobs install from the exports, so they must be exactly what uv.lock pins.
      # requirements-resolve.txt holds uv and pip-audit for the installers' fresh resolve (scripts/fresh_deps.py).
      # requirements-gui.txt is the base plus the optional extra 'gui' (PySide6), which the desktop installers install.
      - name: requirements.txt, requirements-gui.txt and requirements-dev.txt are the exports of uv.lock
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project -o requirements.txt
          uv export --frozen --format requirements-txt --no-dev --extra gui --no-emit-project -o requirements-gui.txt
          uv export --frozen --format requirements-txt --only-group dev --no-emit-project -o requirements-dev.txt
          uv export --frozen --format requirements-txt --only-group resolve --no-emit-project -o requirements-resolve.txt
          git diff --exit-code -- requirements.txt requirements-gui.txt requirements-dev.txt requirements-resolve.txt

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows needs about 45 minutes for the whole suite, Linux with the GUI extra about 30 (headless about 15).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies (with the GUI extra, as the desktop installers do)
        # --no-deps: the exports are complete (every package, every hash), so pip installs exactly that set and does
        # not resolve again (pyproject.toml [tool.uv] overrides one upstream cap: Pillow).
        run: python -m pip install --no-deps -r requirements-gui.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -ra --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  runtime-layer-tools:
    # The runtime layer's two static tools made the way "build" (scripts/runtime_toolbox.py: the framework's builder
    # image over the pinned util-linux and busybox tarballs, each checked by its sha256), then the runtime layer's
    # tests on the real kernel with these real tools (as root: they hand the runner exactly CAP_SETUID and
    # CAP_SETGID). The tools and their SHA256SUMS are uploaded as a workflow artifact for inspection only: util-linux
    # setpriv is C and never a release asset; the framework's own Rust llmcf-setpriv is (release-tools.yml).
    name: Runtime layer tools (Linux, real static busybox and setpriv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install dependencies (base only)
        run: python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Build the static busybox and setpriv the way "build"
        run: python scripts/runtime_toolbox.py "$RUNNER_TEMP/runtime-toolbox"

      - name: Runtime layer tests with the real tools (as root)
        # Some tests start Python as an unprivileged test account (uid 64020, no groups) that imports the framework
        # from this checkout; the runner's home is 0750, so the way to the checkout is opened for other users (pass
        # through for the folders above it, read for the checkout). A computer with a private home skips those
        # tests with a plain reason instead.
        run: |
          dir="$GITHUB_WORKSPACE"
          while [ "$dir" != "/" ]; do dir="$(dirname "$dir")"; sudo chmod o+x "$dir"; done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo -E env "PATH=$PATH" "LLMCF_TEST_TOOLBOX=$RUNNER_TEMP/runtime-toolbox" \
            "$(command -v python)" -m pytest -ra tests/test_runtime_layer.py tests/test_stage_user.py

      - name: Build llmcf-setpriv (static musl, the toolchain of rust/rust-toolchain.toml)
        # The framework's own Rust uid switch (rust/llmcf-setpriv): linked with rust-lld and the toolchain's own
        # musl, no C cross toolchain; refused when it is not static
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --release --locked -p llmcf-setpriv --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/llmcf-setpriv
          if readelf -lW "$bin" | grep -q 'program interpreter'; then echo "llmcf-setpriv is not static" >&2; exit 1; fi
          cp "$bin" "$RUNNER_TEMP/llmcf-setpriv-amd64"

      - name: llmcf-setpriv's switch on the real kernel (its own tests, as root)
        # Drops to an unprivileged account and checks the ids, the groups, the capability sets and that becoming
        # root again fails; the test binaries run through sudo
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test --locked -p llmcf-setpriv

      - name: Runtime layer tests with llmcf-setpriv as the layer's uid switch (as root)
        # The same real-kernel tests as above, with the static llmcf-setpriv in the layer's bin/setpriv: the runner's
        # switch of the entrypoint and every stage switch of stage_user.sh go through it
        run: |
          sudo -E env "PATH=$PATH" "LLMCF_TEST_TOOLBOX=$RUNNER_TEMP/runtime-toolbox" \
            "LLMCF_TEST_LAYER_SETPRIV=$RUNNER_TEMP/llmcf-setpriv-amd64" \
            "$(command -v python)" -m pytest -ra tests/test_runtime_layer.py tests/test_stage_user.py

      - name: Upload the tools and their SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-layer-tools-linux-amd64
          path: ${{ runner.temp }}/runtime-toolbox
          if-no-files-found: error

  rust:
    # The Rust workspace (rust/): llmcf-install, the board bundle's root helper, llmcf-setpriv, llmcf-gateway (the
    # board's token-saving middleware, tested against a stub llama-server) and llmcf-pair (pairing by code, SPAKE2 over
    # a local link; its test build's loopback-as-link mode runs against the framework's side) and llmcf-detect (the
    # board's vision engine: its test build with the simulated NPU, cargo feature sim-npu, runs end to end behind the
    # gateway; its release program is linked for aarch64 with glibc 2.31 by zig through cargo-zigbuild, both pinned,
    # and its ELF checked: the aarch64 interpreter, only the C library's own libraries, no glibc symbol above 2.31,
    # the simulated NPU refused). The toolchain is
    # the one rust/rust-toolchain.toml pins (rustup on the runner installs it with its three musl targets); the
    # release programs are static musl binaries linked with the toolchain's own rust-lld (rust/.cargo/config.toml).
    # The release build of llmcf-install must refuse the test mode (--root, only under the cargo feature test-root),
    # and the framework's tests of llmcf-install run against the test build on a fake board.
    name: Rust (fmt, clippy, tests, static musl builds, the vision engine's glibc build, cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: "1"
      # a runner has no keyring: the framework's tests below keep the vault in memory
      LLM_SECRET_STORAGE: ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p llmcf-install --all-targets --features test-root -- -D warnings
          cargo clippy --locked -p llmcf-pair --all-targets --features test-mode -- -D warnings
          cargo clippy --locked -p llmcf-detect --all-targets --features sim-npu -- -D warnings

      - name: cargo test (the test build of llmcf-install against a fake root prefix)
        run: |
          cargo test --locked --workspace --features llmcf-install/test-root
          cargo test --locked -p llmcf-pair --features test-mode
          cargo test --locked -p llmcf-detect --features sim-npu

      - name: Static musl release builds (x86_64, aarch64, armv7)
        # llmcf-gateway's TLS (rustls with ring) compiles a little C: clang cross-compiles it for each target
        run: |
          ar="$(command -v llvm-ar || find /usr/bin -name 'llvm-ar-*' | sort -V | tail -n 1)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cargo build --locked --release -p llmcf-install --target "$target"
            cargo build --locked --release -p llmcf-pair --target "$target"
            t="$(echo "$target" | tr - _)"
            env "CC_$t=clang" "CFLAGS_$t=--target=$target" "AR_$t=$ar" \
              cargo build --locked --release -p llmcf-gateway --target "$target"
          done

      - name: Every release program is static
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            for program in "target/$target/release/llmcf-install" "target/$target/release/llmcf-gateway" \
                "target/$target/release/llmcf-pair"; do
              file "$program"
              if readelf -lW "$program" | grep -q INTERP; then echo "$program has a program interpreter" >&2; exit 1; fi
              if readelf -dW "$program" | grep -q NEEDED; then echo "$program needs shared libraries" >&2; exit 1; fi
            done
          done

      - name: The release program refuses the test mode
        run: |
          set +e
          out="$(./target/x86_64-unknown-linux-musl/release/llmcf-install --root /tmp plan llm-test 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && echo "$out" | grep -q "no test mode"
          set +e
          out="$(./target/x86_64-unknown-linux-musl/release/llmcf-pair announce --out /tmp/x --test-loopback 0 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && echo "$out" | grep -q "no test mode"

      - name: The vision engine for aarch64 with glibc 2.31 (zig and cargo-zigbuild, pinned)
        # Rockchip's NPU runtime exists only for glibc, so llmcf-detect is the one board program that is no static
        # musl binary (orchestrator/runtime/bundle/root_helper.py GNU_PROGRAMS: the same pins in the builder image)
        env:
          ZIG_VERSION: "0.13.0"
          ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version =0.19.8
          PATH="$RUNNER_TEMP/zig:$PATH" cargo zigbuild --locked --release -p llmcf-detect \
            --target aarch64-unknown-linux-gnu.2.31

      - name: The vision engine's ELF (interpreter, libraries, glibc baseline) and its refusal of the simulated NPU
        run: |
          bin=target/aarch64-unknown-linux-gnu/release/llmcf-detect
          file "$bin"
          readelf -lW "$bin" | grep -q 'interpreter: /lib/ld-linux-aarch64.so.1' || { echo "not the aarch64 interpreter" >&2; exit 1; }
          for lib in $(readelf -dW "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$lib" in libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|libgcc_s.so.1|librt.so.1|ld-linux-aarch64.so.1) ;;
              *) echo "llmcf-detect needs $lib" >&2; exit 1 ;; esac
          done
          newest="$(readelf -VW "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "newest glibc symbol version: $newest"
          [ "$(printf '%s\n2.31\n' "$newest" | sort -V | tail -n 1)" = "2.31" ] || { echo "a glibc symbol above 2.31" >&2; exit 1; }
          if PATH="$RUNNER_TEMP/zig:$PATH" cargo zigbuild --locked --release -p llmcf-detect --features sim-npu \
              --target aarch64-unknown-linux-gnu.2.31 2>"$RUNNER_TEMP/sim.log"; then
            echo "a release build took the simulated NPU" >&2; exit 1
          fi
          grep -q "for test builds only" "$RUNNER_TEMP/sim.log"
          cargo build --locked --release -p llmcf-detect
          set +e
          out="$(./target/release/llmcf-detect serve --port 8093 --model m --card c --sim-npu /tmp 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && echo "$out" | grep -q "no simulated NPU"

      - name: cargo-deny (pinned version)
        run: |
          cargo install --locked cargo-deny --version =0.19.9
          cargo deny --manifest-path Cargo.toml check

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: The framework's tests of llmcf-install with the test build
        working-directory: .
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          cargo build --locked --manifest-path rust/Cargo.toml -p llmcf-install --features test-root
          LLMCF_INSTALL_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-install" \
            python -m pytest -ra tests/test_llmcf_install.py tests/test_board_bundle.py

      - name: The framework's pairing by code against the test build of llmcf-pair
        working-directory: .
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml -p llmcf-pair --features test-mode
          LLMCF_PAIR_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-pair" \
            python -m pytest -ra tests/test_pair_pake.py

      - name: The vision engine end to end behind the gateway (the simulated NPU)
        working-directory: .
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml -p llmcf-detect --features sim-npu
          cargo build --locked --manifest-path rust/Cargo.toml -p llmcf-gateway
          LLMCF_DETECT_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-detect" \
          LLMCF_GATEWAY_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-gateway" \
            python -m pytest -ra tests/test_bundle_detect.py tests/test_model_card.py

  rust-arm64:
    # The vision engine's tests once more on aarch64 (GitHub's arm64 runner): its unit tests with the simulated NPU and
    # the end-to-end run behind the gateway, the test builds made the same way as on x86_64.
    name: Rust on arm64 (the vision engine's tests and end-to-end run)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: "1"
      LLM_SECRET_STORAGE: ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned toolchain (rust-toolchain.toml)
        run: |
          command -v rustup || { curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - name: cargo test (the vision engine with the simulated NPU)
        run: |
          cargo test --locked -p llmcf-detect --features sim-npu
          cargo build --locked -p llmcf-detect --features sim-npu
          cargo build --locked -p llmcf-gateway

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: The vision engine end to end behind the gateway on aarch64
        working-directory: .
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          LLMCF_DETECT_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-detect" \
          LLMCF_GATEWAY_TEST_BIN="$GITHUB_WORKSPACE/rust/target/debug/llmcf-gateway" \
            python -m pytest -ra tests/test_bundle_detect.py tests/test_model_card.py

  test-headless:
    # The install without the optional extra 'gui' (DESIGN round 11, A3): a headless or server install and the
    # framework image without --gui. No PySide6 and no Qt libraries: the Qt-free checks (tests/test_qt_free_core.py:
    # the core's texts, `llmcf --help`, `llmcf mcp serve` and the plain message of llm-gui) and the non-GUI suite run;
    # the GUI's tests skip themselves.
    name: Tests without the GUI extra (Linux, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # pip cache off for now: the account's cache and egress quota ran out and a job hung at the cache restore

      - name: Install dependencies (base only, no GUI extra)
        run: |
          python -m pip install --no-deps -r requirements.txt -r requirements-dev.txt
          if python -c "import PySide6" 2>/dev/null; then echo "PySide6 is installed; this job must run without it" >&2; exit 1; fi

      - name: Qt-free checks
        run: python -m pytest -ra tests/test_qt_free_core.py tests/test_lazy_loading.py

      - name: Run the non-GUI suite
        run: python -m pytest -ra --junitxml=test-results-headless.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-headless
          path: test-results-headless.xml
          if-no-files-found: ignore
