[tool.poetry]
name = "llm-conversion-framework"
version = "2.3.0"
description = "Orchestrator GUI und CLI für LLM Cross-Compilierung"
authors = ["Smilez1985"]
readme = "README.md"
packages = [{include = "orchestrator"}]

[tool.poetry.dependencies]
# 3.10 is end-of-life (2026-10); lower bounds below exclude all versions with known advisories.
python = ">=3.11,<3.14"

# --- 1. Core & Installer ---
requests = ">=2.34,<3"
psutil = ">=7.0,<8"
pyyaml = "^6.0.3"
packaging = ">=24.2"

# --- 2. Docker Orchestration ---
docker = "^7.1.0"

# --- 3. GUI & CLI ---
pyside6 = ">=6.10,<6.13"
click = "^8.3"
rich = ">=13.9,<16"

# --- 4. Security ---
cryptography = ">=49,<51"
keyring = ">=25.6"

# --- 5. AI Agent & RAG (host side) ---
# Exact pin on purpose: litellm 1.82.7/1.82.8 were a PyPI supply-chain compromise (2026-03).
litellm = "1.104.2"
tiktoken = ">=0.8"
qdrant-client = "^1.19"
huggingface-hub = ">=1.31,<3"

# --- 6. Crawler & Ingestion ---
beautifulsoup4 = "^4.14"
pypdf = ">=6.19,<7"
langdetect = "^1.0.9"

# --- 7. Deployment (SSH) ---
paramiko = ">=3.5.1,<6"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
ruff = ">=0.17"
bandit = ">=1.9"
pip-audit = ">=2.10"
shellcheck-py = ">=0.11"
actionlint-py = ">=1.7.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
llm-gui = "orchestrator.main:main"
llm-cli = "orchestrator.cli:cli"
