[project]
name = "llm-cross-compiler-framework"
version = "3.4.0"
description = "Convert and quantize language models for edge hardware (GUI, CLI and MCP server)"
authors = [{ name = "Smilez1985" }]
readme = "README.md"
# 3.10 is end-of-life (2026-10); lower bounds below exclude all versions with known advisories.
requires-python = ">=3.11,<3.15"
# Version policy (DECISIONS round 65): every dependency is a range from the tested version up to the next major
# (0.x packages that break in a minor release: up to the next minor), never an old exact pin; uv.lock fixes the
# tested set, the scheduled update run (.github/workflows/deps-update.yml) and every installer run resolve the newest
# versions inside these ranges after a 5-day cooldown, test and audit them. One exact pin stays: pyrage, which
# encrypts user data.
dependencies = [
    # --- 1. Core & Installer ---
    "requests>=2.34.2,<3",
    "psutil>=7.2.2,<8",
    "pyyaml>=6.0.3,<7",
    "packaging>=26.3,<27",

    # --- 2. Docker Orchestration ---
    "docker>=7.2.0,<8",

    # --- 3. CLI (the GUI's Qt is the optional extra 'gui' below) ---
    "click>=8.5.0,<9",
    "rich>=15.0.0,<16",

    # --- 4. Security ---
    "cryptography>=50.0.2,<51",
    "keyring>=25.7.0,<26",
    # Cross-process lock of the credential vault (GUI, CLI and MCP server write it); already installed through
    # huggingface-hub, now a direct dependency.
    "filelock>=4.2.8,<5",
    # Privately shared community packs use the age format: rage (the Rust implementation of age) through its binding.
    # Exact pin: it encrypts and decrypts user data.
    "pyrage==1.4.0",

    # --- 5. AI Agent & RAG (host side) ---
    # Ditto's provider layer uses the official SDKs only (OpenAI-compatible servers go through openai).
    # LLM tooling is a supply-chain target: ranges up to the next major (DECISIONS round 65), and the lock, the
    # scheduled update run and every installer run take a version only after the 5-day cooldown, the full tests and
    # pip-audit.
    "anthropic>=2.4.0,<3",
    "openai>=3.45.0,<4",
    # Local embeddings (ONNX on the CPU) and the knowledge base's storage: Qdrant Edge, the Rust engine of Qdrant in
    # the process (exact pin: it holds the person's knowledge base). It has no wheel for Windows on ARM: there the
    # knowledge base keeps qdrant-client's local mode. qdrant-client also serves an optional Qdrant server (setting
    # qdrant_url) and reads the local storage of earlier versions to convert it.
    # 0.x: fastembed and Qdrant Edge change models, API or the storage format in a minor release, so the range ends
    # before the next minor (Qdrant Edge holds the person's knowledge base: a new minor is a deliberate step).
    "fastembed>=0.9.1,<0.10",
    "qdrant-edge-py>=0.9.0,<0.10; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "qdrant-client>=1.20.0,<2",
    "huggingface-hub>=1.33.0,<3",

    # Schemas for tool inputs/outputs, forced JSON answers and the MCP server.
    "pydantic>=2.14.2,<3",
    # Model Context Protocol server (spec 2026-07-28). LLM tooling is a supply-chain target: up to the next major,
    # each version through the cooldown, tests and pip-audit (as anthropic and openai).
    "mcp>=2.3.0,<3",
    # Agent Client Protocol (Zed/JetBrains, protocol version 1, Apache-2.0): Ditto as an ACP agent for editors and
    # llmcf as an ACP client that runs agents the person picks (DECISIONS round 54). 0.x: its minor releases change
    # the protocol's types, so the range ends before the next minor.
    "agent-client-protocol>=0.12.1,<0.13",

    # --- 6. Crawler & Ingestion ---
    "beautifulsoup4>=4.15.0,<5",
    "pypdf>=7.0.0,<8",
    "langdetect>=1.0.9,<2",

    # --- 7. Deployment (SSH) ---
    "paramiko>=5.1.0,<6",
    # Pairing a board by the code its hardware probe shows (orchestrator/remote/pair_pake.py): SPAKE2 over Ed25519
    # with libsodium's constant-time group operations. Already installed through paramiko; a direct dependency now.
    # It carries the pairing's key exchange: up to the next major, each version through the cooldown, tests and
    # pip-audit (the pairing's end-to-end test runs both sides against each other).
    "pynacl>=1.6.2,<2",

    # --- 8. The build doorbell (Core/doorbell.py): every build end to the person's MQTT broker ---
    # aiomqtt (BSD-3-Clause) over Eclipse Paho (EPL-2.0 OR BSD-3-Clause, used under BSD-3-Clause); imported only when a
    # doorbell is sent. They carry a credential to the broker: up to the next major, each version through the
    # cooldown, tests and pip-audit.
    "aiomqtt>=2.5.1,<3",
    "paho-mqtt>=2.1.0,<3",
]

[project.optional-dependencies]
# The desktop GUI (DECISIONS round 11, A3): the installers install it (requirements-gui.txt); a headless or server
# install, the framework image without --gui and the CLI and MCP server work without it (orchestrator/gui is the only
# code that imports Qt). Only QtCore/QtGui/QtWidgets are used; the essentials wheel skips WebEngine, Pdf and the
# add-ons. Qt keeps source and binary compatibility within a major (Qt 6), so the range ends before 7.
gui = [
    "pyside6-essentials>=6.12.0,<7",
]

[project.scripts]
llm-gui = "orchestrator.main:main"
llm-cli = "orchestrator.cli:cli"
# The command's new name (seventh round, item 11); llm-cli stays as an alias of the same program.
llmcf = "orchestrator.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    # ruff treats a minor release as breaking (new rules, changed defaults) while it is 0.x
    "ruff>=0.17.3,<0.18",
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1,<3",
    # shellcheck-py follows ShellCheck, whose 0.x minor releases add checks that can fail the lint
    "shellcheck-py>=0.11.0.1,<0.12",
    "actionlint-py>=1.7.12,<2",
]
# The fresh resolve on the machine (scripts/fresh_deps.py from install.sh and install.bat) and the scheduled update run:
# uv resolves the newest compatible set, pip-audit audits it. Installed from the hash-pinned export
# requirements-resolve.txt into a temporary tool environment, never into the framework's own.
resolve = [
    # uv treats a minor release as breaking while it is 0.x
    "uv>=0.13.7,<0.14",
    "pip-audit>=2.10.1,<3",
]

[tool.uv]
# The cooldown (DECISIONS round 65): uv takes only versions uploaded at least 5 days ago (uv computes now minus 5 days
# in UTC at every lock). It holds for every `uv lock` and `uv lock --upgrade`, in the scheduled update run
# (.github/workflows/deps-update.yml), on the machine (install.sh, install.bat through scripts/fresh_deps.py) and for
# `uv lock --check` in CI. Needs a uv that reads relative values (0.11.32, the version CI uses, does).
exclude-newer = "5 days"

[tool.uv.exclude-newer-package]
# Versions taken inside their cooldown on purpose, each up to the second after its upload. An entry ends once the
# cooldown has passed its date (then it would only hold the package back): scripts/fresh_deps.py drops it in the
# scheduled update run and in every installer run.
# pypdf 7.0.0 (security fixes, the person's decision in round 65); filelock 4.2.9 (Dependabot); openai 3.45.0 (the
# version in the lock before, younger than 5 days on the day of this update).
pypdf = "2026-11-06T12:10:04Z"
filelock = "2026-11-04T18:37:11Z"
openai = "2026-11-04T02:24:11Z"

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# The folder of a passed test is removed when it ends. A Qdrant Edge store sets up some 160 MB of files (write-ahead
# log, segments) that stay empty and sparse on Linux but take real room on NTFS: keeping every test's folder to the end
# of the run filled the Windows runner's disk.
tmp_path_retention_policy = "failed"
# The disk guard in tests/conftest.py counts apparent sizes (what NTFS allocates): a test that needs more temporary room
# than the per-test budget says so with this marker and its reason.
markers = [
    "temp_budget(megabytes, reason): this test may leave up to `megabytes` in its temporary folders (reason required)",
    "real_toolbox: this test runs the runtime layer's real ensure_toolbox (no test toolbox is put into its cache)",
]

[tool.uv.build-backend]
# The package lives at the top of the repository (orchestrator/), not below src/.
module-name = "orchestrator"
module-root = ""
