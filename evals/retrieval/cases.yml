  - id: retr-xl-de-gated-401
    kind: retrieval
    query: "Der Modell-Download scheitert mit 401, das Repository ist zugangsbeschränkt"
    tags: [de, cross-lingual]
    expect: {relevant: [hf-gated-models], within: 3}

  # --- identifiers: flags, file names, quantization types ------------------------------------------------------
  - id: retr-id-ggml-cuda
    kind: retrieval
    query: "GGML_CUDA"
    tags: [identifier]
    expect: {relevant: [llama-cpp-cuda-flags], within: 1}

  - id: retr-id-dggml-cuda-on
    kind: retrieval
    query: "-DGGML_CUDA=ON"
    tags: [identifier]
    expect: {relevant: [llama-cpp-cuda-flags, jetson-jetpack-cuda], within: 3}

  - id: retr-id-rknn-toolkit2
    kind: retrieval
    query: "rknn_toolkit2"
    tags: [identifier]
    expect: {relevant: [rknn-toolkit2-install], within: 3}

  - id: retr-id-librkllmrt
    kind: retrieval
    query: "librkllmrt.so"
    tags: [identifier]
    expect: {relevant: [rkllm-version-mismatch], within: 3}

  - id: retr-id-cuda-arch-87
    kind: retrieval
    query: "CMAKE_CUDA_ARCHITECTURES=87"
