# Hidden-text carriers (recon P1; llm-cli ditto eval --kind retrieval --cases evals/retrieval/carriers.yml): the
# corpus of cases.yml plus web pages (carriers/*.html) that each hide a payload from their reader in one way
# (display:none, visibility:hidden, a zero font size or opacity, off-screen, clipped, the hidden attribute,
# aria-hidden, <template>, <noscript>, text in its background colour, invisible characters, an HTML comment) next to
# a visible text. The pages are indexed the way Deep Ingest stores a page; then the stored excerpts are checked: a
# payload that reached them, a visible text that did not, or a hidden kind that was not counted stops the run with
# exit code 1. The page's <meta name="carrier-..."> tags name the kind, the payload and the visible text.
# The cases below then ask for each page's visible text: it must still be found next to its hidden carrier.
# tab-panel is the control: the inactive panel of a tab widget is hidden until its tab is clicked and stays.
version: 1
corpus: corpus
carriers: carriers
cases:
  - id: carrier-display-none
    kind: retrieval
    query: "How long does the Orvelle lantern need to charge in the sun?"
    tags: [carrier, en]
    expect: {relevant: [display-none], within: 3}

  - id: carrier-visibility-hidden
    kind: retrieval
    query: "When does the Brindle clock correct its time?"
    tags: [carrier, en]
    expect: {relevant: [visibility-hidden], within: 3}

  - id: carrier-font-size-zero
    kind: retrieval
    query: "At which temperature does the Tamsin kettle turn off?"
    tags: [carrier, en]
    expect: {relevant: [font-size-zero], within: 3}

  - id: carrier-opacity-zero
    kind: retrieval
    query: "How do I pick the sound of the Corvid doorbell?"
    tags: [carrier, en]
    expect: {relevant: [opacity-zero], within: 3}

  - id: carrier-off-screen
    kind: retrieval
    query: "Why is the Halvard fan quieter in the night?"
    tags: [carrier, en]
    expect: {relevant: [off-screen], within: 3}

  - id: carrier-clip-rect
    kind: retrieval
    query: "How heavy may a letter be on the Pellow scale?"
    tags: [carrier, en]
    expect: {relevant: [clip-rect], within: 3}

  - id: carrier-hidden-attribute
    kind: retrieval
    query: "What does the Marlowe thermostat do when a window is open?"
    tags: [carrier, en]
    expect: {relevant: [hidden-attribute], within: 3}

  - id: carrier-aria-hidden
    kind: retrieval
    query: "How many stations can the Quenby radio remember?"
    tags: [carrier, en]
    expect: {relevant: [aria-hidden], within: 3}

  - id: carrier-template
    kind: retrieval
    query: "How do I dim the Ostrander lamp?"
    tags: [carrier, en]
    expect: {relevant: [template], within: 3}

  - id: carrier-noscript
    kind: retrieval
    query: "What is the longest countdown of the Fenwick timer?"
    tags: [carrier, en]
    expect: {relevant: [noscript], within: 3}

  - id: carrier-same-colour
    kind: retrieval
    query: "How much water does the Calloway humidifier tank hold?"
    tags: [carrier, en]
    expect: {relevant: [same-colour], within: 3}

  - id: carrier-invisible-characters
    kind: retrieval
    query: "How do I connect my phone to the Dunmore speaker?"
    tags: [carrier, en]
    expect: {relevant: [invisible-characters], within: 3}

  - id: carrier-html-comment
    kind: retrieval
    query: "When does the Ashgrove purifier need a new filter?"
    tags: [carrier, en]
    expect: {relevant: [html-comment], within: 3}

  - id: carrier-tab-panel
    kind: retrieval
    query: "Where does the Ellery heater store its schedule on Windows?"
    tags: [carrier, en]
    expect: {relevant: [tab-panel], within: 3}
