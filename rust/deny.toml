# cargo-deny's checks of the Rust workspace (the CI job "rust" runs cargo-deny with a pinned version): known
# advisories, the licences every crate may carry, crates only from crates.io, no git sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-1-Clause", "Unicode-3.0", "BSL-1.0", "Unlicense"]
confidence-threshold = 0.9

[licenses.private]
# the workspace's own crates (publish = false) are the framework's (MIT, LICENSE.txt)
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
